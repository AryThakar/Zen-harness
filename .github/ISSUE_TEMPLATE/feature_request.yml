name: Feature request
description: Suggest something Zen harness should do, or do differently
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and where does Zen get in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like instead
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Anything it must not break
      description: Zen checks facts, numbers and files by code, asks before downloading or deleting, and runs on an open model you host yourself. Note any tension with those.
