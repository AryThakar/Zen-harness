[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-business-analyst"
version = "0.2.0"
description = "Upload business sales data, ask questions in plain English, get answers, forecasts and charts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "charset-normalizer>=3.0",
    "duckdb>=1.1",
    "fastapi>=0.115",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "python-multipart>=0.0.9",
    "rapidfuzz>=3.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
ui = ["plotly>=5.19", "requests>=2.31", "streamlit>=1.50"]
dev = ["ai-business-analyst[ui]", "httpx2>=2.0", "pytest>=8"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.db" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
