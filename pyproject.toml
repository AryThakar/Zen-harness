[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zen-harness"
version = "1.3.0"
description = "Zen harness: a personal assistant that gets real work out of an open model you run yourself - a main assistant with web, knowledge, data and coding helpers."
readme = "README.md"
license = { file = "LICENSE" }  # PolyForm Noncommercial 1.0.0
authors = [{ name = "AryThakar" }]
requires-python = ">=3.11"
dependencies = [
    "charset-normalizer>=3.0",
    "ddgs>=9.16",
    "duckdb>=1.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "langgraph>=1.2",
    "lxml>=5.0",
    "matplotlib>=3.8",
    "mcp>=2.3",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pillow>=10.0",
    "pyarrow>=15.0",
    "pypdf>=6.0",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "python-multipart>=0.0.9",
    "rapidfuzz>=3.0",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "simpleeval>=1.0",
    "sqlglot>=30.0",
    "statsforecast>=2.0",
    "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/AryThakar/Zen-harness"
Releases = "https://github.com/AryThakar/Zen-harness/releases"

[project.optional-dependencies]
# Libraries for the scripts the assistant runs (run_python): charts, maths, data, ML, files.
sandbox = ["beautifulsoup4>=4.12", "imbalanced-learn>=0.12", "jinja2>=3.1", "lightgbm>=4.0", "networkx>=3.0",
           "nltk>=3.8", "opencv-python-headless>=4.8", "polars>=1.0", "scikit-image>=0.22",
           "seaborn>=0.13", "statsmodels>=0.14", "sympy>=1.12", "tabulate>=0.9", "xgboost>=2.0", "xlrd>=2.0",
           "xlsxwriter>=3.1"]
dev = ["zen-harness[sandbox]", "httpx2>=2.0", "pytest>=8"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_browser: runs the installed headless browser (Playwright MCP); skipped where there is none"]
