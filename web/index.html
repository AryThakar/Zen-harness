<style>
/* ── Tokens ─────────────────────────────────────────────────────────────── */
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI Variable Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Consolas, monospace;

  --bg: #fbfbfd;
  --elev: #ffffff;
  --glass: rgba(251, 251, 253, .74);
  --fill: #f2f2f7;
  --fill-2: #e8e8ed;
  --text: #1d1d1f;
  --text-2: #6e6e73;
  --text-3: #8e8e93;
  --sep: rgba(60, 60, 67, .11);
  --sep-2: rgba(60, 60, 67, .2);
  --accent: #0071e3;
  --accent-hover: #0077ed;
  --accent-soft: rgba(0, 113, 227, .09);
  --green: #248a3d;
  --green-dot: #34c759;
  --red: #d70015;
  --red-dot: #ff3b30;
  --orange: #c93400;
  --orange-dot: #ff9500;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .04), 0 2px 8px rgba(0, 0, 0, .04);
  --shadow: 0 1px 3px rgba(0, 0, 0, .05), 0 8px 28px rgba(0, 0, 0, .08);
  --shadow-lg: 0 4px 14px rgba(0, 0, 0, .06), 0 28px 70px rgba(0, 0, 0, .16);
  --r-sm: 10px;
  --r: 16px;
  --r-lg: 22px;
  --ease: cubic-bezier(.22, .61, .36, 1);
  --spring: cubic-bezier(.34, 1.4, .64, 1);
  --col: 768px;
  --bar-h: 56px;
  --dock-h: 150px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --elev: #1c1c1e;
    --glass: rgba(18, 18, 20, .72);
    --fill: #1c1c1e;
    --fill-2: #2c2c2e;
    --text: #f5f5f7;
    --text-2: #a1a1a6;
    --text-3: #86868b;
    --sep: rgba(84, 84, 88, .42);
    --sep-2: rgba(84, 84, 88, .7);
    --accent: #0a84ff;
    --accent-hover: #409cff;
    --accent-soft: rgba(10, 132, 255, .16);
    --green: #30d158;
    --green-dot: #30d158;
    --red: #ff453a;
    --red-dot: #ff453a;
    --orange: #ff9f0a;
    --orange-dot: #ff9f0a;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .5);
    --shadow: 0 1px 3px rgba(0, 0, 0, .5), 0 10px 30px rgba(0, 0, 0, .5);
    --shadow-lg: 0 4px 14px rgba(0, 0, 0, .5), 0 28px 70px rgba(0, 0, 0, .7);
  }
}

/* ── Base ───────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 400 16px/1.6 var(--font);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; border-radius: 10px; }
svg { display: block; }
.icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ── Top bar ────────────────────────────────────────────────────────────── */
.bar {
  position: fixed; inset: 0 0 auto 0; z-index: 20; height: var(--bar-h);
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
  padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
  background: var(--glass);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid transparent;
  transition: border-color .3s var(--ease);
}
.bar.scrolled { border-bottom-color: var(--sep); }
.brand { display: flex; align-items: center; gap: 9px; font: 600 17px/1 var(--font-display); letter-spacing: -.01em; }
.brand .glyph { width: 22px; height: 22px; }
.model-pill {
  display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px 0 10px;
  border-radius: 999px; background: var(--fill); color: var(--text-2);
  font-size: 13px; font-weight: 500; white-space: nowrap;
}
.model-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); box-shadow: 0 0 0 3px transparent; transition: background .3s; }
.model-pill.ready .dot { background: var(--green-dot); box-shadow: 0 0 0 3px color-mix(in srgb, var(--green-dot) 20%, transparent); }
.model-pill.down .dot { background: var(--orange-dot); }
.model-pill .where { color: var(--text-3); font-weight: 400; }
.bar-actions { justify-self: end; display: flex; gap: 4px; }
.icon-btn {
  position: relative; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
  color: var(--text-2); transition: background .2s, color .2s, transform .2s var(--spring);
}
.icon-btn:hover { background: var(--fill); color: var(--text); }
.icon-btn:active { transform: scale(.94); }
.badge {
  position: absolute; top: 3px; right: 2px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px;
  background: var(--accent); color: #fff; font: 600 10px/16px var(--font); text-align: center;
}

/* ── Conversation ───────────────────────────────────────────────────────── */
.scroller {
  position: fixed; inset: 0; overflow-y: auto; overscroll-behavior: contain;
  padding: calc(var(--bar-h) + 24px) 20px calc(var(--dock-h) + 24px);
  scroll-behavior: auto;
}
.thread { max-width: var(--col); margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
.enter { animation: rise .45s var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.msg.user { align-self: flex-end; max-width: min(82%, 620px); }
.msg.user .bubble {
  background: var(--fill); padding: 10px 16px; border-radius: 20px 20px 6px 20px;
  white-space: pre-wrap; overflow-wrap: anywhere; font-size: 16px; line-height: 1.5;
}
.msg.ai { display: flex; flex-direction: column; gap: 14px; }

/* Hero / empty state */
.hero {
  min-height: calc(100dvh - var(--bar-h) - var(--dock-h) - 60px);
  display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
  padding: 24px 0 8px;
}
.hero .glyph { width: 56px; height: 56px; margin-bottom: 22px; filter: drop-shadow(0 8px 24px rgba(191, 90, 242, .35)); animation: float 6s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-5px) rotate(6deg); } }
.hero h1 { margin: 0; font: 700 clamp(30px, 4.4vw, 42px)/1.1 var(--font-display); letter-spacing: -.028em; }
.hero p.lede { margin: 12px auto 0; max-width: 520px; color: var(--text-2); font-size: 17px; line-height: 1.5; }
.facts { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 22px; }
.fact {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 999px;
  background: var(--fill); color: var(--text-2); font-size: 13px; font-variant-numeric: tabular-nums;
}
.fact b { color: var(--text); font-weight: 600; }
.suggestions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: 100%; max-width: 640px; margin-top: 30px; }
.suggestion {
  display: flex; align-items: center; gap: 12px; text-align: left; padding: 14px 16px; border-radius: var(--r);
  background: var(--elev); border: 1px solid var(--sep); box-shadow: var(--shadow-sm);
  font-size: 14.5px; line-height: 1.35; color: var(--text);
  transition: transform .25s var(--spring), box-shadow .25s var(--ease), border-color .25s;
}
.suggestion:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--sep-2); }
.suggestion:active { transform: scale(.985); }
.suggestion .s-icon { flex: none; width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: #fff; }
.suggestion .s-icon .icon { width: 17px; height: 17px; stroke-width: 2; }
.hero-cta { margin-top: 26px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.hero-cta span { color: var(--text-3); font-size: 13px; }
.notice {
  margin-top: 24px; max-width: 520px; padding: 12px 16px; border-radius: var(--r); text-align: left;
  background: color-mix(in srgb, var(--orange-dot) 10%, var(--elev)); border: 1px solid color-mix(in srgb, var(--orange-dot) 30%, transparent);
  color: var(--text); font-size: 14px; line-height: 1.45;
}
.notice b { display: block; margin-bottom: 2px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 18px;
  border-radius: 999px; font-size: 15px; font-weight: 500; background: var(--fill); color: var(--text);
  transition: background .2s, transform .2s var(--spring), opacity .2s;
}
.btn:hover { background: var(--fill-2); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-hover); }
.btn.danger { color: var(--red); }
.btn:disabled { opacity: .5; }
.btn .icon { width: 17px; height: 17px; }

/* Activity (tool steps) */
.activity { border-radius: var(--r); }
.activity-head {
  display: inline-flex; align-items: center; gap: 10px; min-height: 30px; padding: 4px 10px 4px 4px; margin-left: -4px;
  border-radius: 999px; color: var(--text-2); font-size: 14px; transition: background .2s;
}
.activity-head:hover { background: var(--fill); }
.activity-head .chev { width: 14px; height: 14px; transition: transform .3s var(--ease); color: var(--text-3); }
.activity.open .activity-head .chev { transform: rotate(90deg); }
.orb {
  width: 20px; height: 20px; border-radius: 50%; flex: none;
  background: conic-gradient(from var(--angle, 0deg), #0a84ff, #bf5af2, #ff375f, #ff9f0a, #64d2ff, #0a84ff);
  animation: turn 2.4s linear infinite; position: relative;
}
.orb::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--bg); }
.activity.done .orb { display: none; }
.done-mark { display: none; width: 20px; height: 20px; border-radius: 50%; background: var(--fill); color: var(--text-2); place-items: center; }
.done-mark .icon { width: 13px; height: 13px; stroke-width: 2.4; }
.activity.done .done-mark { display: grid; }
.label.shimmer {
  background: linear-gradient(90deg, var(--text-3) 0%, var(--text) 45%, var(--text-3) 90%) 0 0 / 200% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 1.8s linear infinite;
}
@keyframes shimmer { to { background-position: -200% 0; } }
@property --angle { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
@keyframes turn { to { --angle: 360deg; } }
.steps { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s var(--ease); }
.activity.open .steps { grid-template-rows: 1fr; }
.steps-inner { overflow: hidden; }
.steps-list { margin: 10px 0 2px 9px; padding-left: 19px; border-left: 1.5px solid var(--sep); display: flex; flex-direction: column; gap: 14px; }
.step { position: relative; }
.step::before {
  content: ""; position: absolute; left: -24.5px; top: 7px; width: 9px; height: 9px; border-radius: 50%;
  background: var(--bg); border: 2px solid var(--text-3);
}
.step.ok::before { border-color: var(--green-dot); background: var(--green-dot); }
.step.err::before { border-color: var(--orange-dot); background: var(--orange-dot); }
.step.run::before { border-color: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px var(--accent-soft); } }
.step-title { font-size: 14px; font-weight: 600; color: var(--text); }
.step-note {
  font-size: 13px; color: var(--text-2); margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; line-clamp: 4; overflow: hidden;
}
.step.err .step-note { color: var(--orange); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--fill); color: var(--text-2); }
pre.code {
  margin: 8px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--fill); overflow-x: auto;
  font: 12.5px/1.55 var(--mono); color: var(--text); white-space: pre-wrap; word-break: break-word;
}

/* Answer (markdown) */
.answer { font-size: 16px; line-height: 1.65; overflow-wrap: anywhere; }
.answer:empty { display: none; }
.answer > :first-child { margin-top: 0; }
.answer > :last-child { margin-bottom: 0; }
.answer p { margin: 0 0 .85em; }
.answer h1, .answer h2, .answer h3, .answer h4 { font-family: var(--font-display); letter-spacing: -.01em; line-height: 1.3; margin: 1.3em 0 .5em; }
.answer h1 { font-size: 22px; } .answer h2 { font-size: 19px; } .answer h3, .answer h4 { font-size: 16.5px; }
.answer ul, .answer ol { margin: 0 0 .9em; padding-left: 1.35em; }
.answer li { margin: .25em 0; }
.answer li::marker { color: var(--text-3); }
.answer strong { font-weight: 650; }
.answer a { color: var(--accent); text-decoration: none; }
.answer a:hover { text-decoration: underline; }
.answer code { font: .88em var(--mono); background: var(--fill); padding: .12em .38em; border-radius: 6px; }
.answer pre { background: var(--fill); padding: 12px 14px; border-radius: 12px; overflow-x: auto; }
.answer pre code { background: none; padding: 0; }
.answer hr { border: 0; border-top: 1px solid var(--sep); margin: 1.4em 0; }
.answer blockquote { margin: 0 0 .9em; padding-left: 14px; border-left: 3px solid var(--sep-2); color: var(--text-2); }
.caret { display: inline-block; width: .55em; height: 1.05em; margin-left: 2px; vertical-align: -.16em; border-radius: 2px; background: var(--accent); animation: blink 1s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }

/* Tables (answers, cards and steps) */
.table-wrap { overflow-x: auto; margin: 0 0 1em; border: 1px solid var(--sep); border-radius: 14px; background: var(--elev); }
.card .table-wrap, .step .table-wrap { margin: 0; }
.step .table-wrap { margin-top: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
th, td { padding: 9px 14px; text-align: left; white-space: nowrap; }
th { font-size: 12px; font-weight: 600; color: var(--text-2); background: color-mix(in srgb, var(--fill) 60%, var(--elev)); position: sticky; top: 0; }
td { border-top: 1px solid var(--sep); }
tr:hover td { background: color-mix(in srgb, var(--fill) 45%, transparent); }
td.num, th.num { text-align: right; }
.step table { font-size: 12.5px; }
.step th, .step td { padding: 6px 12px; }

/* Cards (charts, tables) */
.artifacts { display: flex; flex-direction: column; gap: 14px; }
.artifacts:empty { display: none; }
.card { background: var(--elev); border: 1px solid var(--sep); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); padding: 18px 20px 16px; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.card-title { font: 600 15.5px/1.3 var(--font-display); letter-spacing: -.01em; }
.card-sub { font-size: 12.5px; color: var(--text-3); margin-top: 2px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.legend i.dash { background: repeating-linear-gradient(90deg, var(--accent) 0 4px, transparent 4px 7px) !important; }
.legend i.band { height: 10px; border-radius: 3px; }
.legend i.dot { width: 8px; height: 8px; border-radius: 50%; }
.plot { position: relative; height: 240px; }
.bars { display: flex; flex-direction: column; gap: 9px; }
.bar-row { display: grid; grid-template-columns: minmax(90px, 34%) 1fr auto; align-items: center; gap: 12px; font-size: 13.5px; }
.bar-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
.bar-row .track { height: 10px; border-radius: 5px; background: var(--fill); overflow: hidden; }
.bar-row .fill { height: 100%; width: 0; border-radius: 5px; background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 75%, #64d2ff), var(--accent)); transition: width .9s var(--ease); }
.bar-row .val { font-variant-numeric: tabular-nums; color: var(--text-2); min-width: 64px; text-align: right; }
.more { margin-top: 10px; font-size: 13px; color: var(--accent); font-weight: 500; }
.muted { color: var(--text-3); font-size: 13px; }

/* Sources */
.sources { display: flex; flex-direction: column; gap: 8px; }
.sources:empty { display: none; }
.sources-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.sources-label { font-size: 12px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; margin-right: 4px; }
.source {
  display: inline-flex; align-items: center; gap: 6px; max-width: 100%; height: 28px; padding: 0 11px 0 9px; border-radius: 999px;
  background: var(--fill); color: var(--text-2); font-size: 12.5px; transition: background .2s, color .2s;
}
.source:hover, .source[aria-expanded="true"] { background: var(--fill-2); color: var(--text); }
.source .icon { width: 14px; height: 14px; }
.source span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.passage { font-size: 14px; line-height: 1.55; color: var(--text-2); background: var(--elev); border: 1px solid var(--sep); border-radius: var(--r); padding: 12px 14px; animation: rise .3s var(--ease); }
.passage b { color: var(--text); font-weight: 600; display: block; margin-bottom: 4px; font-size: 13px; }

/* Answer footer */
.meta { display: flex; align-items: center; gap: 4px; min-height: 28px; color: var(--text-3); font-size: 12.5px; font-variant-numeric: tabular-nums; opacity: 0; transition: opacity .3s; }
.meta.show { opacity: 1; }
.meta .stat { display: inline-flex; align-items: center; gap: 4px; }
.meta .mini { width: 13px; height: 13px; }
.meta .sep { opacity: .5; margin: 0 4px; }
.meta .icon-btn { width: 28px; height: 28px; border-radius: 8px; margin-left: 2px; }
.meta .icon-btn .icon { width: 15px; height: 15px; }
.callout { padding: 12px 14px; border-radius: var(--r); background: color-mix(in srgb, var(--red-dot) 9%, var(--elev)); border: 1px solid color-mix(in srgb, var(--red-dot) 25%, transparent); font-size: 14px; }

/* Upload events */
.event { align-self: center; width: min(460px, 100%); }
.file-card { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: var(--r); background: var(--elev); border: 1px solid var(--sep); box-shadow: var(--shadow-sm); }
.file-icon { flex: none; width: 36px; height: 40px; border-radius: 8px; display: grid; place-items: center; color: #fff; font: 700 9.5px/1 var(--font); letter-spacing: .03em; }
.file-main { min-width: 0; flex: 1; }
.file-name { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-status { font-size: 12.5px; color: var(--text-2); margin-top: 2px; }
.file-card.err .file-status { color: var(--red); }
.file-card.ok .file-status { color: var(--text-2); }
.progress { height: 4px; border-radius: 2px; background: var(--fill); overflow: hidden; margin-top: 7px; }
.progress div { height: 100%; width: 0; background: var(--accent); border-radius: 2px; transition: width .2s; }
.progress.indeterminate div { width: 35%; animation: slide 1.1s var(--ease) infinite; }
@keyframes slide { from { transform: translateX(-110%); } to { transform: translateX(310%); } }
.file-state { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; }
.file-card.ok .file-state { background: var(--green-dot); color: #fff; }

/* ═══ API ═══════════════════════════════════════════════════════════════ */
async function detail(response) {
  try {
    const body = await response.json();
    if (typeof body.detail === "string") return body.detail;
    if (Array.isArray(body.detail)) return body.detail.map(d => d.msg).join("; ");
  } catch {}
  return `${response.status} ${response.statusText}`;
}
async function api(path, options = {}) {
  let r;
  try { r = await fetch(path, options); } catch { throw new Error("Can't reach the server. Is it running?"); }
  if (!r.ok) throw new Error(await detail(r));
  return r.status === 204 ? null : r.json();
}
const postJson = (path, body) => api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body ?? {}) });

function uploadFile(url, file, onProgress) {  // XHR, for upload progress
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open("POST", url);
    xhr.responseType = "json";
    xhr.upload.onprogress = e => e.lengthComputable && onProgress(e.loaded / e.total);
    xhr.onload = () => {
      if (xhr.status < 300) return resolve(xhr.response);
      const d = xhr.response?.detail;
      reject(new Error(typeof d === "string" ? d : Array.isArray(d) ? d.map(x => x.msg).join("; ") : `Upload failed (${xhr.status})`));
    };
    xhr.onerror = () => reject(new Error("Can't reach the server."));
    const form = new FormData();
    form.append("file", file);
    xhr.send(form);
  });
}

async function* serverEvents(response) {
  const reader = response.body.getReader(), decoder = new TextDecoder();
  let buffer = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    let cut;
    while ((cut = buffer.indexOf("\n\n")) >= 0) {
      const raw = buffer.slice(0, cut);
      buffer = buffer.slice(cut + 2);
      let event = "message";
      const data = [];
      for (const line of raw.split("\n")) {
        if (line.startsWith("event:")) event = line.slice(6).trim();
        else if (line.startsWith("data:")) data.push(line.slice(5).trimStart());
      }
      if (data.length) yield [event, JSON.parse(data.join("\n"))];
    }
  }
}

function citedSources(items, answer) {

  const named = unique.filter(i => said.includes(stem(i.filename)) || said.includes(i.filename.toLowerCase()));
  return named.length ? named : unique.slice(0, 2);
}

function metaEl({ total, first, stats, answer, stopped }) {

  if (first != null) parts.push([`first word ${(first / 1000).toFixed(1)} s`]);
  const tokens = (stats || []).reduce((n, s) => n + (s.output_tokens || 0), 0);
  const genSeconds = (stats || []).reduce((t, s) => t + (s.tokens_per_second ? s.output_tokens / s.tokens_per_second : 0), 0);
  if (tokens && genSeconds) parts.push([`${(tokens / genSeconds).toFixed(1)} tok/s`, "bolt"]);
  const el = h("div", { class: "meta" });
  parts.forEach(([text, icon], i) => {
    if (i) el.append(h("span", { class: "sep" }, "·"));
    el.append(h("span", { class: "stat", title: icon === "bolt" ? `${tokens} tokens written` : null,
      html: (icon ? svg(icon, "icon mini") : "") + escapeHtml(text) }));
  });
  if (answer) {
    const copy = h("button", { class: "icon-btn", "aria-label": "Copy answer", title: "Copy", html: svg("copy") });
    copy.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(answer); copy.innerHTML = svg("check"); setTimeout(() => (copy.innerHTML = svg("copy")), 1400); }
      catch { toast("Couldn't copy", true); }
    });
    el.append(copy);
  }
  requestAnimationFrame(() => el.classList.add("show"));
  return el;
}

// One assistant reply, built up from the stream.
function assistantView() {
  const root = h("div", { class: "msg ai enter" });
  const activity = activityEl();
  const artifacts = h("div", { class: "artifacts" });
  const answer = h("div", { class: "answer" });
  root.append(activity.el, artifacts, answer);
  thread.append(root);
  stick(true);
  let text = "", turnStart = 0, frame = 0, streaming = true;
  const sources = [];
  const paint = () => {
    frame = 0;
    answer.innerHTML = markdown(text);
    polish(answer);
    if (streaming && text) addCaret(answer);
    stick();
  };
  const repaint = () => { if (!frame) frame = requestAnimationFrame(paint); };
  return {
    text(chunk) { if (!text.slice(turnStart)) activity.writing(); text += chunk; repaint(); },
    restart() { text = text.slice(0, turnStart); repaint(); },
    toolStart(d) {
      if (text.slice(turnStart).trim()) text = text.trimEnd() + "\n\n";
      turnStart = text.length;
      activity.start(d);
      repaint();
    },
    toolEnd(d) {
      activity.end(d);
      if (d.artifact?.kind === "sources" && !d.is_error) sources.push(...d.artifact.items);
      const el = artifactEl(d);
      if (el) { artifacts.append(el); stick(); }
    },
    finish(final, meta) {
      streaming = false;
      if (final != null) text = final;
      cancelAnimationFrame(frame);
      paint();
      activity.finish();
      const src = sourcesEl(sources, text);
      if (src) root.append(src);
      root.append(metaEl({ ...meta, answer: text.trim() }));
      stick();
    },
    error(message) {
      streaming = false;
      paint();
      activity.stop();
      root.append(h("div", { class: "callout" }, message));
      stick();
    },
    stop(meta) {
      streaming = false;
      paint();
      activity.stop();
      root.append(metaEl({ ...meta, stopped: true, answer: text.trim() }));
    },
  };
}

// A finished exchange from the saved conversation.
function renderExchange(ex) {
  addUser(ex.question);
  const view = assistantView();
  for (const step of ex.steps || []) { view.toolStart(step); view.toolEnd({ ...step, is_error: !!step.is_error }); }
  view.finish(ex.answer || "", {});
}

/* ═══ Asking ════════════════════════════════════════════════════════════ */
async function ask(question) {
  question = question.trim();
  if (!question || state.busy) return;
  if (state.status && !state.status.ready) { toast(state.status.message || "The model isn't ready yet.", true); return; }
  hideHero();
  input.value = "";
  autosize();
  addUser(question);
  const view = assistantView();
  setBusy(true);
  const controller = new AbortController();
  state.controller = controller;
  const started = performance.now();
  let first = null, answered = false, failed = false;
  const stats = [];
  try {
    const body = state.thread ? { message: question, thread_id: state.thread } : { message: question };
    const r = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body), signal: controller.signal });
    if (!r.ok) throw new Error(await detail(r));
    for await (const [event, data] of serverEvents(r)) {
      if (event === "thread") { state.thread = data.thread_id; save(THREAD_KEY, data.thread_id); }
      else if (event === "text") { first ??= performance.now(); view.text(data.text); }
      else if (event === "restart") view.restart();
      else if (event === "tool_start") view.toolStart(data);
      else if (event === "tool_end") view.toolEnd(data);
      else if (event === "stats") stats.push(data);
      else if (event === "done") { answered = true; view.finish(data.answer, { total: performance.now() - started, first: first && first - started, stats }); }
      else if (event === "error") { failed = true; view.error(data.message); }
    }
    if (!answered && !failed) view.error("The answer was cut off. Please try again.");
  } catch (e) {
    if (e.name === "AbortError") view.stop({ total: performance.now() - started, first: first && first - started, stats });
    else view.error(e.message === "Failed to fetch" ? "Lost the connection to the server." : e.message);
  } finally {
    state.controller = null;
    setBusy(false);
    input.focus();
  }
}

function setBusy(busy) {
  state.busy = busy;
  document.body.classList.toggle("busy", busy);
  composer.classList.toggle("working", busy);
  $("#sendBtn").setAttribute("aria-label", busy ? "Stop" : "Send");
  updateSend();
}
function updateSend() { $("#sendBtn").disabled = !state.busy && !input.value.trim(); }
function autosize() {
  input.style.height = "auto";
  input.style.height = `${Math.min(input.scrollHeight, 200)}px`;
}

composer.addEventListener("submit", e => {
  e.preventDefault();
  if (state.busy) state.controller?.abort();
  else ask(input.value);
});
input.addEventListener("input", () => { autosize(); updateSend(); });
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); composer.requestSubmit(); }
});

/* ═══ Files ═════════════════════════════════════════════════════════════ */
const FILE_COLORS = { csv: "#34c759", tsv: "#34c759", xlsx: "#248a3d", xlsm: "#248a3d", pdf: "#ff3b30", docx: "#0a84ff", txt: "#8e8e93", md: "#5e5ce6", markdown: "#5e5ce6" };
const fileIcon = (name, label) => {
  const type = name.includes(".") ? ext(name) : "";
  return h("span", { class: "file-icon", style: `background:${FILE_COLORS[type] || "#8e8e93"}` }, label || type.slice(0, 4).toUpperCase() || "FILE");
};

function uploadCard(name, size) {
  const status = h("div", { class: "file-status" }, size != null ? `${fileSize(size)} · uploading…` : "Working…");
  const bar = h("div");
  const progress = h("div", { class: "progress" }, bar);
  const mark = h("span", { class: "file-state" });
  const box = h("div", { class: "file-card" }, fileIcon(name), h("div", { class: "file-main" }, h("div", { class: "file-name" }, name), status, progress), mark);
  const el = h("div", { class: "event enter" }, box);
  hideHero();
  thread.append(el);
  stick(true);
  return {
    progress(p) { bar.style.width = `${Math.round(p * 100)}%`; if (p >= 1) this.working("Reading the file…"); },
    working(text) { status.textContent = text; progress.classList.add("indeterminate"); },
    ok(text, follow = [], warning) {
      progress.remove(); box.classList.add("ok"); mark.innerHTML = svg("check"); status.textContent = text;
      if (follow.length) el.append(h("div", { class: "chips" }, follow.map(q => h("button", { class: "chip", onclick: () => ask(q) }, q))));
      if (warning) el.append(h("div", { class: "warn" }, warning));
      stick();
    },
    fail(text) { progress.remove(); box.classList.add("err"); mark.innerHTML = svg("cross"); status.textContent = text; stick(); },
  };
}

async function addFiles(files) {
  for (const file of files) {
    const kind = DATA_TYPES.includes(ext(file.name)) ? "data" : DOC_TYPES.includes(ext(file.name)) ? "doc" : null;
    const view = uploadCard(file.name, file.size);
    if (!kind) { view.fail("Not supported. Use CSV or Excel for data; PDF, Word, TXT or Markdown for documents."); continue; }
    try {
      if (kind === "doc") {
        const doc = await uploadFile("/documents", file, p => view.progress(p));
        const where = doc.pages ? `${doc.pages} page${doc.pages === 1 ? "" : "s"}` : `${count(doc.words)} words`;
        view.ok(`${where} · ${doc.chunks} passages indexed${doc.replaced ? " · replaced the earlier version" : ""}`,
          [`What's in ${doc.title || doc.filename}?`], doc.semantic ? null : "Meaning-based search isn't available yet, so it's searched by keywords.");
      } else {
        const preview = await uploadFile("/uploads/preview", file, p => view.progress(p));
        if (preview.missing_required.length) {
          const found = preview.columns.map(c => c.original).slice(0, 8).join(", ");
          view.fail(`Couldn't find ${preview.missing_required.join(", ")}. Columns in the file: ${found}.`);
          continue;
        }
        view.working(`Cleaning ${count(preview.rows)} rows…`);
        const report = await postJson("/uploads", { file_id: preview.file_id, mapping: preview.mapping, profile_name: preview.profile });
        const bits = [`${count(report.rows_loaded)} rows added`];
        if (report.rows_duplicate) bits.push(`${count(report.rows_duplicate)} already there`);
        if (report.rows_rejected) bits.push(`${count(report.rows_rejected)} skipped`);
        const locked = Object.entries(report.locked_features || {})[0];
        view.ok(bits.join(" · "), ["Summarise the new data for me", "What sold best?"],
          locked ? `Tip: add ${/^[aeiou]/.test(locked[0]) ? "an" : "a"} ${locked[0].replace("_", " ")} column to unlock ${locked[1].join(", ")}.` : report.warnings[0]);
      }
    } catch (e) { view.fail(e.message); }
  }
  refreshStatus();
}

async function addSampleData() {
  closeSheet();
  const view = uploadCard("Sample shop data", null);
  view.working("Creating 18 months of sales and 4 documents…");
  try {
    const report = await postJson("/uploads/demo", {});
    const docs = await postJson("/documents/samples", {});
    view.ok(`${count(report.rows_loaded)} sales lines · ${docs.added.length} documents added`,
      ["How did revenue change over the last 3 months?", "Why was our worst day so slow?"]);
  } catch (e) { view.fail(e.message); }
  refreshStatus();
}

$("#attachBtn").addEventListener("click", () => $("#fileInput").click());
$("#fileInput").addEventListener("change", e => { addFiles([...e.target.files]); e.target.value = ""; });
let dragDepth = 0;
const hasFiles = e => [...(e.dataTransfer?.types || [])].includes("Files");
window.addEventListener("dragenter", e => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth++; $("#drop").classList.add("show"); });
window.addEventListener("dragover", e => { if (hasFiles(e)) e.preventDefault(); });
window.addEventListener("dragleave", e => { if (!hasFiles(e)) return; if (--dragDepth <= 0) { dragDepth = 0; $("#drop").classList.remove("show"); } });
window.addEventListener("drop", e => {
  if (!hasFiles(e)) return;
  e.preventDefault(); dragDepth = 0; $("#drop").classList.remove("show");
  addFiles([...e.dataTransfer.files]);
});
input.addEventListener("paste", e => {
  const files = [...(e.clipboardData?.files || [])];
  if (files.length) { e.preventDefault(); addFiles(files); }
});

/* ═══ Library sheet ═════════════════════════════════════════════════════ */
async function openSheet() {
  $("#sheet").classList.add("show"); $("#scrim").classList.add("show"); $("#sheet").setAttribute("aria-hidden", "false");
  await fillSheet();
  $("#sheetClose").focus();
}
function closeSheet() { $("#sheet").classList.remove("show"); $("#scrim").classList.remove("show"); $("#sheet").setAttribute("aria-hidden", "true"); }
async function fillSheet() {
  const [uploads, library] = await Promise.allSettled([api("/uploads"), api("/documents")]);
  const data = uploads.value || [], docs = library.value?.documents || [];
  const day = d => new Date(d).toLocaleDateString(undefined, { day: "numeric", month: "short" });
  const row = (name, meta, onDelete, label) => h("li", {}, fileIcon(name, label), h("div", { class: "li-main" }, h("div", { class: "li-name", title: name }, name), h("div", { class: "li-meta" }, meta)),
    h("button", { class: "icon-btn", "aria-label": `Delete ${name}`, title: "Delete", html: svg("trash"), onclick: onDelete }));
  $("#dataCount").textContent = data.length ? `${count(data.reduce((n, u) => n + u.rows_loaded, 0))} rows` : "";
  $("#docCount").textContent = docs.length ? `${docs.length} file${docs.length === 1 ? "" : "s"}` : "";
  $("#dataList").replaceChildren(...(data.length ? data.map(u => row(u.filename, `${count(u.rows_loaded)} rows · ${day(u.created_at)}`, async () => {
    if (!await confirmDialog(`Delete “${u.filename}”?`, `Its ${count(u.rows_loaded)} sales rows are removed. This can't be undone.`)) return;
    try { await api(`/uploads/${u.upload_id}`, { method: "DELETE" }); toast("Deleted"); } catch (e) { toast(e.message, true); }
    fillSheet(); refreshStatus();
  }, u.filename.includes(".") ? null : "DATA")) : [h("li", { class: "empty" }, "No sales data yet")]));
  $("#docList").replaceChildren(...(docs.length ? docs.map(d => row(d.filename, `${d.pages ? `${d.pages} pages` : `${count(d.words)} words`} · ${day(d.uploaded_at)}`, async () => {
    if (!await confirmDialog(`Delete “${d.filename}”?`, "It will no longer be searched. This can't be undone.")) return;
    try { await api(`/documents/${d.doc_id}`, { method: "DELETE" }); toast("Deleted"); } catch (e) { toast(e.message, true); }
    fillSheet(); refreshStatus();
  })) : [h("li", { class: "empty" }, "No documents yet")]));
}
$("#libraryBtn").addEventListener("click", openSheet);
$("#sheetClose").addEventListener("click", closeSheet);
$("#scrim").addEventListener("click", closeSheet);
$("#sheetAdd").addEventListener("click", () => $("#fileInput").click());
$("#sheetSample").addEventListener("click", addSampleData);

function confirmDialog(title, text) {
  const dialog = $("#dialog");
  $("#dialogTitle").textContent = title;
  $("#dialogText").textContent = text;
  dialog.classList.add("show");
  $("#dialogCancel").focus();
  return new Promise(resolve => {
    const done = value => { dialog.classList.remove("show"); $("#dialogOk").onclick = $("#dialogCancel").onclick = null; resolve(value); };
    $("#dialogOk").onclick = () => done(true);
    $("#dialogCancel").onclick = () => done(false);
    dialog.onclick = e => { if (e.target === dialog) done(false); };
  });
}
function toast(message, error = false) {
  const el = h("div", { class: `toast${error ? " err" : ""}` }, message);
  $("#toasts").append(el);
  setTimeout(() => { el.style.transition = "opacity .3s"; el.style.opacity = "0"; setTimeout(() => el.remove(), 300); }, 3200);
}

/* ═══ Conversation lifecycle ════════════════════════════════════════════ */
function newConversation() {
  state.controller?.abort();
  state.thread = null;
  save(THREAD_KEY, null);
  thread.replaceChildren();
  renderHero();
  input.focus();
}
$("#newChatBtn").addEventListener("click", newConversation);
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if ($("#dialog").classList.contains("show")) $("#dialogCancel").click();
    else if ($("#sheet").classList.contains("show")) closeSheet();
    else if (state.busy) state.controller?.abort();
  }
});

async function restore() {
  if (!state.thread) return false;
  try {
    const r = await fetch(`/chat/threads/${state.thread}`);
    if (!r.ok) { save(THREAD_KEY, null); state.thread = null; return false; }
    const { exchanges } = await r.json();
    exchanges.forEach(renderExchange);
    requestAnimationFrame(() => stick(true));
    return exchanges.length > 0;
  } catch { return false; }
}

// Keep the conversation clear of the composer, whatever its height.
new ResizeObserver(() => {
  const dock = $("#dock").getBoundingClientRect().height;
  document.documentElement.style.setProperty("--dock-h", `${Math.ceil(dock) - 12}px`);
}).observe($("#dock"));
const phone = matchMedia("(max-width: 640px)");
const setPlaceholder = () => { input.placeholder = phone.matches ? "Ask anything…" : "Ask about your business, or drop a file…"; };
phone.addEventListener("change", setPlaceholder);
setPlaceholder();

(async () => {
  const restored = await restore();
  if (!restored) renderHero();
  await refreshStatus();
  input.focus();
})();
</script>
