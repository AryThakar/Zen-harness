<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zen</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='3.666 3.666 17.334 17.334'%3E%3Cdefs%3E%3ClinearGradient id='m' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23b9adff'/%3E%3Cstop offset='1' stop-color='%235a47e0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M15.399 3.666 A9 9 0 1 1 3.666 15.399 A8.4 8.4 0 0 0 15.399 3.666Z' fill='url(%23m)'/%3E%3C/svg%3E">
<script>
  // Before the first paint: the theme (the user's pick, else the system's) and whether the intro has played this session
  try {
    const root = document.documentElement, theme = localStorage.getItem("zen.theme");
    root.dataset.theme = theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    if (sessionStorage.getItem("zen.intro") === "1" || matchMedia("(prefers-reduced-motion: reduce)").matches) root.classList.add("no-intro");
  } catch {}
</script>
<link rel="stylesheet" href="/static/fonts/fonts.css">
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.47/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.4.16/dist/purify.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.47/dist/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script type="module" src="/static/js/app.js"></script>
</head>
<body class="empty">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><linearGradient id="moon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b9adff"/><stop offset="1" stop-color="#5a47e0"/></linearGradient></defs>
  <symbol id="crescent" viewBox="0 0 24 24"><path d="M15.399 3.666 A9 9 0 1 1 3.666 15.399 A8.4 8.4 0 0 0 15.399 3.666Z" fill="url(#moon)"/></symbol>
  <!-- the same crescent, its box cut to the crescent itself: the logo beside the name -->
  <symbol id="mark" viewBox="3.666 3.666 17.334 17.334"><path d="M15.399 3.666 A9 9 0 1 1 3.666 15.399 A8.4 8.4 0 0 0 15.399 3.666Z" fill="url(#moon)"/></symbol>
  <!-- the loader: the moon's lit part is the disc minus a shade that slides across it -->
  <mask id="phaseMask" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
    <rect width="24" height="24" fill="#fff"/><circle class="phase-shade" cx="12" cy="12" r="9.3" fill="#000"/></mask>
  <symbol id="phase" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="url(#moon)" opacity=".2"/>
    <circle cx="12" cy="12" r="9" fill="url(#moon)" mask="url(#phaseMask)"/></symbol>
</svg>

<div class="intro" aria-hidden="true">
  <div class="intro-lockup">
    <svg class="intro-mark"><use href="#crescent"/></svg>
    <span class="intro-word"><span class="intro-title">Zen</span></span>
  </div>
</div>

<!-- ======================================================== sidebar: the project's chats -->
<aside class="side" aria-label="Chats">
  <div class="brand">
    <div class="logo"><svg><use href="#mark"/></svg>Zen</div>
    <button class="icon-btn" id="collapseBtn" type="button" title="Close sidebar" aria-label="Close sidebar">
      <svg class="i ic-panel" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="3.5"/><path class="bar" d="M9.5 4.5v15"/></svg></button>
  </div>
  <button class="row" id="newChatSide" type="button"><svg class="i ic-new" viewBox="0 0 24 24"><path d="M11.5 4.5h-5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-5"/><path class="ink" d="M8 16h3.5"/><path class="pen" d="M17.3 3.9a1.9 1.9 0 0 1 2.7 2.7l-7.3 7.3-3.4.8.8-3.4z"/></svg>New chat</button>
  <button class="row" id="searchRow" type="button" title="Search this project's chats"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>Search chats</button>
  <div class="search" id="searchBox" hidden>
    <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
    <input id="searchInput" placeholder="Search chats" aria-label="Search this project's chats" autocomplete="off">
    <button id="searchClose" type="button" title="Close search" aria-label="Close search"><svg class="i" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
  </div>
  <button class="row" id="filesSide" type="button" title="This project's files and data"><svg class="i ic-files" viewBox="0 0 24 24"><path d="M4 9.5V6.5a2 2 0 0 1 2-2h3.4l2 2H18a2 2 0 0 1 2 2v1"/><path class="paper" d="M6.5 9.5V8h11v1.5"/><path class="front" d="M3.6 11.2a1.6 1.6 0 0 1 1.6-1.7h13.6a1.6 1.6 0 0 1 1.6 1.7l-.6 6.4a2 2 0 0 1-2 1.9H6.2a2 2 0 0 1-2-1.9z"/></svg>Files &amp; data<span class="count" id="filesCount"></span></button>

  <!-- every chat belongs to the project you are in -->
  <div class="scrollable" id="chatList"></div>

  <div class="here" id="here">
    <span class="tile" id="projectTile">P</span>
    <div class="here-text"><b id="projectName">Project</b><small>Project</small></div>
    <button class="icon-btn" id="leaveBtn" type="button" title="Leave this project" aria-label="Leave this project"><svg class="i" viewBox="0 0 24 24"><path d="M10 4H6.5A2.5 2.5 0 0 0 4 6.5v11A2.5 2.5 0 0 0 6.5 20H10"/><path d="m15 8 4 4-4 4M19 12H9"/></svg></button>
  </div>
</aside>
<div class="side-scrim" id="sideScrim"></div>

<!-- ======================================================== main: the chat -->
<div class="main">
  <header class="top">
    <div class="glass" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="top-left">
      <button class="icon-btn show-side" id="showSideBtn" type="button" title="Open sidebar" aria-label="Open sidebar">
        <svg class="i ic-panel" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="3.5"/><path class="bar" d="M9.5 4.5v15"/></svg></button>
      <span class="chat-title" id="chatTitle">New chat</span>
      <span class="pins" id="pins" aria-label="Files pinned to this chat" hidden></span>
      <span class="model-state" id="modelState" hidden>Model starting</span>
    </div>
    <div class="top-right">
      <button class="icon-btn files-btn" id="filesTop" type="button" title="Files &amp; data" aria-label="Files and data"><svg class="i ic-files" viewBox="0 0 24 24"><path d="M4 9.5V6.5a2 2 0 0 1 2-2h3.4l2 2H18a2 2 0 0 1 2 2v1"/><path class="paper" d="M6.5 9.5V8h11v1.5"/><path class="front" d="M3.6 11.2a1.6 1.6 0 0 1 1.6-1.7h13.6a1.6 1.6 0 0 1 1.6 1.7l-.6 6.4a2 2 0 0 1-2 1.9H6.2a2 2 0 0 1-2-1.9z"/></svg><span class="badge" id="filesBadge" hidden></span></button>
      <button class="icon-btn" id="newChatTop" type="button" title="New chat" aria-label="New chat"><svg class="i ic-new" viewBox="0.5 -0.6 24 24"><path d="M11.5 4.5h-5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-5"/><path class="ink" d="M8 16h3.5"/><path class="pen" d="M17.3 3.9a1.9 1.9 0 0 1 2.7 2.7l-7.3 7.3-3.4.8.8-3.4z"/></svg></button>
      <button class="icon-btn theme-btn" id="themeBtn" type="button" title="Light or dark" aria-label="Switch between light and dark"><svg class="i ic-theme" viewBox="0 0 24 24"><g class="moon"><path d="M20.37 13.47A8.5 8.5 0 1 1 10.53 3.63A7 7 0 0 0 20.37 13.47Z"/></g><g class="sun"><circle cx="12" cy="12" r="4"/><path d="M12 2.6v2M12 19.4v2M2.6 12h2M19.4 12h2M5.4 5.4l1.4 1.4M17.2 17.2l1.4 1.4M5.4 18.6l1.4-1.4M17.2 6.8l1.4-1.4"/></g></svg></button>
    </div>
  </header>

  <div class="scroll" id="scroller">
    <div class="hello">
      <svg><use href="#crescent"/></svg>
      <h1 id="helloText">What can I help with?</h1>
      <div class="notice" id="helloNotice" hidden></div>
    </div>
    <div class="thread" id="thread" aria-live="polite"></div>
  </div>
  <button class="jump" id="jump" type="button" title="Back to the latest message" aria-label="Back to the latest message"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M6.5 13.5 12 19l5.5-5.5"/></svg></button>

  <div class="dock">
    <form class="composer" id="composer" autocomplete="off">
      <div class="tray" id="tray" hidden aria-label="Attached files"></div>
      <button type="button" class="round plus" id="attachBtn" title="Add files (tables, documents, pictures, any file)" aria-label="Add files"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <textarea id="input" rows="1" placeholder="Ask anything · @ points at a file" aria-label="Message"></textarea>
      <button type="submit" class="round send" id="sendBtn" title="Send" aria-label="Send" disabled>
        <svg class="i send-ic" viewBox="0 0 24 24" style="stroke-width:2.5"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg>
        <svg class="i stop-ic" viewBox="0 0 12 12"><rect width="12" height="12" rx="2.6" fill="currentColor" stroke="none"/></svg></button>
    </form>
    <div class="starters" id="starters"></div>
    <div class="fine">Zen runs on this computer and can make mistakes. Open "Worked for" to see how an answer was found.</div>
  </div>
</div>

<!-- ======================================================== a file, beside the chat (view only) -->
<aside class="fileview" aria-label="File">
  <div class="fv-resize" role="separator" aria-orientation="vertical" aria-label="Resize the file panel" tabindex="0" title="Drag to resize · double-click to reset"></div>
  <div class="fv-inner">
    <div class="fv-head">
      <span class="ficon" id="fvIcon"></span>
      <div class="fv-title"><b id="fvName"></b><small id="fvMeta"></small></div>
      <div class="fv-modes" id="fvModes" hidden><button type="button" data-mode="preview">Preview</button><button type="button" data-mode="source">Source</button></div>
      <div class="fv-actions" id="fvActions" hidden><button type="button" id="fvEdit">Edit</button><button type="button" id="fvSave" hidden disabled>Save</button><button type="button" id="fvRun" class="run-btn" hidden>Run</button></div>
      <button class="icon-btn" id="fvCopy" type="button" title="Copy" aria-label="Copy the file"><svg class="i" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8"/></svg></button>
      <a class="icon-btn" id="fvDownload" title="Download" aria-label="Download the file"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14"/></svg></a>
      <button class="icon-btn fv-wide" id="fvWide" type="button" title="Full width" aria-label="Full width"><svg class="i" viewBox="0 0 24 24"><path class="a" d="M14 4.5h5.5V10M19.5 4.5 13 11"/><path class="a" d="M10 19.5H4.5V14M4.5 19.5 11 13"/></svg></button>
      <button class="icon-btn" id="fvClose" type="button" title="Close (Esc)" aria-label="Close the file"><svg class="i" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
    </div>
    <div class="fv-tabs" id="fvTabs" hidden><span class="fv-tab"><i class="dot" id="fvDot"></i><span id="fvTabName"></span></span></div>
    <div class="fv-body" id="fvBody"></div>
    <div class="fv-status" id="fvStatus"></div>
  </div>
</aside>

<!-- ======================================================== Files & data: everything in the project -->
<div class="scrim" id="drawerScrim"></div>
<aside class="drawer" aria-label="Files and data">
  <div class="drawer-head">
    <div><h2>Files &amp; data</h2><small id="drawerSub"></small></div>
    <button class="icon-btn" id="drawerClose" type="button" title="Close" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot"><button class="add-btn" id="drawerAdd" type="button"><svg class="i" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M12 5v14M5 12h14"/></svg>Add files</button></div>
</aside>

<!-- ======================================================== the viewer -->
<div class="viewer" hidden role="dialog" aria-modal="true" aria-label="Viewer">
  <div class="viewer-top">
    <span class="viewer-title"></span>
    <a class="v-btn v-download" title="Download" aria-label="Download"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14"/></svg></a>
    <button class="v-btn v-close" type="button" title="Close (Esc)" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
  </div>
  <div class="viewer-stage"><div class="viewer-item"></div></div>
  <div class="viewer-zoom">
    <button class="v-out" type="button" title="Zoom out (−)" aria-label="Zoom out"><svg class="i" viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
    <span class="pct">100%</span>
    <button class="v-in" type="button" title="Zoom in (+)" aria-label="Zoom in"><svg class="i" viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></button>
    <button class="v-fit" type="button" title="Fit (0)" aria-label="Fit"><svg class="i" viewBox="0 0 24 24"><path d="M4.5 9V5.5a1 1 0 0 1 1-1H9M15 4.5h3.5a1 1 0 0 1 1 1V9M19.5 15v3.5a1 1 0 0 1-1 1H15M9 19.5H5.5a1 1 0 0 1-1-1V15"/></svg></button>
  </div>
</div>

<!-- ======================================================== projects: where "Leave project" goes -->
<div class="projects" aria-label="Projects">
  <div class="projects-inner">
    <div class="projects-brand"><svg><use href="#mark"/></svg>Zen</div>
    <div class="projects-head">
      <div><h1>Projects</h1><p id="projectsLede"></p></div>
      <button class="new-project-btn" id="newProjectBtn" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New project</button>
    </div>
    <div class="project-grid" id="projectList"></div>
  </div>
</div>

<div class="drop" id="drop" aria-hidden="true"><div><b>Drop to attach</b>Tables, documents, pictures, any file: they go with your next message</div></div>
<input type="file" id="fileInput" multiple hidden>

<div class="dialog-scrim" id="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dialogTitle">
  <div class="dialog" id="dialogBox">
    <h3 id="dialogTitle"></h3>
    <p id="dialogText"></p>
    <input id="dialogInput" hidden maxlength="80">
    <div class="dialog-extra" id="dialogExtra"></div>
    <div class="dialog-actions"><button type="button" id="dialogCancel">Cancel</button><button type="button" id="dialogOk" class="primary">OK</button></div>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="assertive"></div>
</body>
</html>
