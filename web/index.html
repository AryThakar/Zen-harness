<style>
/* ── Tokens ─────────────────────────────────────────────────────────────── */
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI Variable Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Consolas, monospace;

  --bg: #fbfbfd;
  --side-bg: #f4f4f7;
  --elev: #ffffff;
  --glass: rgba(251, 251, 253, .74);
  --fill: #f2f2f7;
  --fill-2: #e8e8ed;
  --text: #1d1d1f;
  --text-2: #6e6e73;
  --text-3: #8e8e93;
  --sep: rgba(60, 60, 67, .11);
  --sep-2: rgba(60, 60, 67, .2);
  --accent: #0071e3;
  --accent-hover: #0077ed;
  --accent-soft: rgba(0, 113, 227, .09);
  --green: #248a3d;
  --green-dot: #34c759;
  --red: #d70015;
  --red-dot: #ff3b30;
  --orange: #c93400;
  --orange-dot: #ff9500;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .04), 0 2px 8px rgba(0, 0, 0, .04);
  --shadow: 0 1px 3px rgba(0, 0, 0, .05), 0 8px 28px rgba(0, 0, 0, .08);
  --shadow-lg: 0 4px 14px rgba(0, 0, 0, .06), 0 28px 70px rgba(0, 0, 0, .16);
  --r-sm: 10px;
  --r: 16px;
  --r-lg: 22px;
  --ease: cubic-bezier(.22, .61, .36, 1);
  --spring: cubic-bezier(.34, 1.4, .64, 1);
  --col: 768px;
  --bar-h: 56px;
  --dock-h: 150px;
  --side-w: 272px;
  --side-x: var(--side-w);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --side-bg: #0e0e10;
    --elev: #1c1c1e;
    --glass: rgba(18, 18, 20, .72);
    --fill: #1c1c1e;
    --fill-2: #2c2c2e;
    --text: #f5f5f7;
    --text-2: #a1a1a6;
    --text-3: #86868b;
    --sep: rgba(84, 84, 88, .42);
    --sep-2: rgba(84, 84, 88, .7);
    --accent: #0a84ff;
    --accent-hover: #409cff;
    --accent-soft: rgba(10, 132, 255, .16);
    --green: #30d158;
    --green-dot: #30d158;
    --red: #ff453a;
    --red-dot: #ff453a;
    --orange: #ff9f0a;
    --orange-dot: #ff9f0a;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .5);
    --shadow: 0 1px 3px rgba(0, 0, 0, .5), 0 10px 30px rgba(0, 0, 0, .5);
    --shadow-lg: 0 4px 14px rgba(0, 0, 0, .5), 0 28px 70px rgba(0, 0, 0, .7);
  }
}
@media (max-width: 900px) { :root { --side-x: 0px; } }

/* ── Base ───────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }  /* classes that set display must not override it */
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 400 16px/1.6 var(--font);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { cursor: default; }
input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; border-radius: 10px; }
svg { display: block; }
.icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
a { color: var(--accent); }

/* ── Sidebar: workspace and its chats ───────────────────────────────────── */
.side {
  position: fixed; inset: 0 auto 0 0; z-index: 25; width: var(--side-w);
  display: flex; flex-direction: column; gap: 4px; padding: 12px 10px max(12px, env(safe-area-inset-bottom));
  background: var(--side-bg); border-right: 1px solid var(--sep);
}
.side-brand { display: flex; align-items: center; gap: 9px; padding: 6px 8px 10px; font: 600 16px/1 var(--font-display); letter-spacing: -.01em; }
.side-brand .glyph { width: 22px; height: 22px; }
.ws { position: relative; }
.ws-btn {
  width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px;
  background: var(--elev); border: 1px solid var(--sep); box-shadow: var(--shadow-sm); text-align: left;
  transition: border-color .2s;
}
.ws-btn:hover { border-color: var(--sep-2); }
.ws-mark { flex: none; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; color: #fff; font: 700 12px/1 var(--font); background: linear-gradient(135deg, #0a84ff, #bf5af2); }
.ws-main { flex: 1; min-width: 0; }
.ws-label, .ws-name { display: block; }
.ws-label { font-size: 11px; color: var(--text-3); line-height: 1.2; }
.ws-name { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.3; }
.ws-btn .icon { width: 16px; height: 16px; color: var(--text-3); }
.menu {
  position: absolute; z-index: 40; left: 0; right: 0; top: calc(100% + 6px); padding: 6px; border-radius: 14px;
  background: var(--elev); border: 1px solid var(--sep); box-shadow: var(--shadow-lg);
  max-height: 60vh; overflow-y: auto; animation: rise .2s var(--ease);
}
.menu[hidden] { display: none; }
.menu button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px; font-size: 14px; text-align: left; }
.menu button:hover { background: var(--fill); }
.menu button.current { font-weight: 600; }
.menu button .icon { width: 16px; height: 16px; color: var(--text-3); }
.menu button .n { margin-left: auto; color: var(--text-3); font-size: 12px; }
.menu button.danger { color: var(--red); }
.menu button.danger .icon { color: var(--red); }
.menu hr { border: 0; border-top: 1px solid var(--sep); margin: 6px 4px; }
.side-new {
  display: flex; align-items: center; gap: 10px; padding: 9px 10px; margin-top: 8px; border-radius: 12px; font-size: 14px; font-weight: 500;
  transition: background .2s;
}
.side-new:hover { background: var(--fill-2); }
.side-new .icon { width: 18px; height: 18px; }
.side-label { padding: 14px 10px 6px; font-size: 12px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; }
.chat-list { flex: 1; overflow-y: auto; margin: 0 -4px; padding: 0 4px; list-style: none; }
.chat-item {
  position: relative; display: flex; align-items: center; gap: 8px; padding: 8px 6px 8px 10px; border-radius: 10px;
  font-size: 14px; cursor: pointer; transition: background .15s;
}
.chat-item:hover { background: var(--fill-2); }
.chat-item.active { background: var(--elev); box-shadow: var(--shadow-sm); }
.chat-item .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat-item .when { flex: none; font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.chat-item .q { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.chat-item .run { flex: none; width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--accent); border-right-color: transparent; animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.chat-item .del { flex: none; width: 26px; height: 26px; border-radius: 7px; display: none; place-items: center; color: var(--text-3); }
.chat-item:hover .del, .chat-item .del:focus-visible { display: grid; }
.chat-item:hover .when { display: none; }
.chat-item .del:hover { color: var(--red); background: color-mix(in srgb, var(--red-dot) 12%, transparent); }
.chat-item .del .icon { width: 15px; height: 15px; }
.chat-empty { padding: 10px; font-size: 13px; color: var(--text-3); }
.side-foot { border-top: 1px solid var(--sep); padding-top: 8px; }
.side-item { width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 12px; font-size: 14px; transition: background .2s; }
.side-item:hover { background: var(--fill-2); }
.side-item .icon { width: 18px; height: 18px; color: var(--text-2); }
.side-item .count { margin-left: auto; font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.side-scrim { display: none; }
@media (max-width: 900px) {
  .side { transform: translateX(-102%); transition: transform .4s var(--spring); box-shadow: var(--shadow-lg); }
  body.side-open .side { transform: none; }
  .side-scrim { display: block; position: fixed; inset: 0; z-index: 24; background: rgba(0, 0, 0, .25); opacity: 0; pointer-events: none; transition: opacity .3s; }
  body.side-open .side-scrim { opacity: 1; pointer-events: auto; }
}

/* ── Top bar ────────────────────────────────────────────────────────────── */
.bar {
  position: fixed; inset: 0 0 auto var(--side-x); z-index: 20; height: var(--bar-h);
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
  padding: 0 max(16px, env(safe-area-inset-right)) 0 16px;
  background: var(--glass);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid transparent;
  transition: border-color .3s var(--ease);
}
.bar.scrolled { border-bottom-color: var(--sep); }
.bar-left { display: flex; align-items: center; gap: 6px; min-width: 0; }
.chat-title { font: 600 15px/1.2 var(--font-display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn.menu-btn { display: none; }
@media (max-width: 900px) { .icon-btn.menu-btn { display: grid; } }
.model-pill {
  display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px 0 10px;
  border-radius: 999px; background: var(--fill); color: var(--text-2);
  font-size: 13px; font-weight: 500; white-space: nowrap;
}
.model-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); box-shadow: 0 0 0 3px transparent; transition: background .3s; }
.model-pill.ready .dot { background: var(--green-dot); box-shadow: 0 0 0 3px color-mix(in srgb, var(--green-dot) 20%, transparent); }
.model-pill.down .dot { background: var(--orange-dot); }
.model-pill .where { color: var(--text-3); font-weight: 400; }
.bar-actions { justify-self: end; display: flex; gap: 4px; }
.icon-btn {
  position: relative; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
  color: var(--text-2); transition: background .2s, color .2s, transform .2s var(--spring);
}
.icon-btn:hover { background: var(--fill); color: var(--text); }
.icon-btn:active { transform: scale(.94); }
.badge {
  position: absolute; top: 3px; right: 2px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px;
  background: var(--accent); color: #fff; font: 600 10px/16px var(--font); text-align: center;
}

/* ── Conversation ───────────────────────────────────────────────────────── */
.scroller {
  position: fixed; inset: 0 0 0 var(--side-x); overflow-y: auto; overscroll-behavior: contain;
  padding: calc(var(--bar-h) + 24px) 20px calc(var(--dock-h) + 24px);
}
.thread { max-width: var(--col); margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
.enter { animation: rise .45s var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.msg.user { align-self: flex-end; max-width: min(82%, 620px); }
.msg.user .bubble {
  background: var(--fill); padding: 10px 16px; border-radius: 20px 20px 6px 20px;
  white-space: pre-wrap; overflow-wrap: anywhere; font-size: 16px; line-height: 1.5;
}
.msg.ai { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

/* Hero / empty state */
.hero {
  min-height: calc(100dvh - var(--bar-h) - var(--dock-h) - 60px);
  display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
  padding: 24px 0 8px;
}
.hero .glyph { width: 56px; height: 56px; margin-bottom: 22px; filter: drop-shadow(0 8px 24px rgba(191, 90, 242, .35)); animation: float 6s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-5px) rotate(6deg); } }
.hero h1 { margin: 0; font: 700 clamp(28px, 4.4vw, 40px)/1.1 var(--font-display); letter-spacing: -.028em; }
.hero p.lede { margin: 12px auto 0; max-width: 520px; color: var(--text-2); font-size: 17px; line-height: 1.5; }
.facts { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 22px; }
.fact {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 999px;
  background: var(--fill); color: var(--text-2); font-size: 13px; font-variant-numeric: tabular-nums;
}
.fact b { color: var(--text); font-weight: 600; }
.suggestions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: 100%; max-width: 640px; margin-top: 30px; }
.suggestion {
  display: flex; align-items: center; gap: 12px; text-align: left; padding: 14px 16px; border-radius: var(--r);
  background: var(--elev); border: 1px solid var(--sep); box-shadow: var(--shadow-sm);
  font-size: 14.5px; line-height: 1.35; color: var(--text);
  transition: transform .25s var(--spring), box-shadow .25s var(--ease), border-color .25s;
}
.suggestion:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--sep-2); }
.suggestion:active { transform: scale(.985); }
.suggestion .s-icon { flex: none; width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: #fff; }
.suggestion .s-icon .icon { width: 17px; height: 17px; stroke-width: 2; }
.hero-hint { margin-top: 18px; color: var(--text-3); font-size: 13px; }
.notice {
  margin-top: 24px; max-width: 520px; padding: 12px 16px; border-radius: var(--r); text-align: left;
  background: color-mix(in srgb, var(--orange-dot) 10%, var(--elev)); border: 1px solid color-mix(in srgb, var(--orange-dot) 30%, transparent);
  color: var(--text); font-size: 14px; line-height: 1.45;
}
.notice b { display: block; margin-bottom: 2px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 18px;
  border-radius: 999px; font-size: 15px; font-weight: 500; background: var(--fill); color: var(--text);
  transition: background .2s, transform .2s var(--spring), opacity .2s;
}
.btn:hover { background: var(--fill-2); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-hover); }
.btn.small { height: 32px; padding: 0 14px; font-size: 13.5px; }
.btn:disabled { opacity: .5; }
.btn .icon { width: 17px; height: 17px; }

/* Activity: the steps of a reply, and what the helpers did inside them */
.activity-head {
  display: inline-flex; align-items: center; gap: 10px; min-height: 30px; padding: 4px 10px 4px 4px; margin-left: -4px;
  border-radius: 999px; color: var(--text-2); font-size: 14px; transition: background .2s; max-width: 100%;
}
.activity-head:hover { background: var(--fill); }
.activity-head .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.activity-head .chev { flex: none; width: 14px; height: 14px; transition: transform .3s var(--ease); color: var(--text-3); }
.activity.open .activity-head .chev { transform: rotate(90deg); }
.orb {
  width: 20px; height: 20px; border-radius: 50%; flex: none;
  background: conic-gradient(from var(--angle, 0deg), #0a84ff, #bf5af2, #ff375f, #ff9f0a, #64d2ff, #0a84ff);
  animation: turn 2.4s linear infinite; position: relative;
}
.orb::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--bg); }
.activity.done .orb, .activity.waiting .orb { display: none; }
.done-mark { display: none; flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--fill); color: var(--text-2); place-items: center; }
.done-mark .icon { width: 13px; height: 13px; stroke-width: 2.4; }
.activity.done .done-mark { display: grid; }
.wait-mark { display: none; flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); place-items: center; }
.wait-mark .icon { width: 13px; height: 13px; stroke-width: 2.2; }
.activity.waiting .wait-mark { display: grid; }
.label.shimmer {
  background: linear-gradient(90deg, var(--text-3) 0%, var(--text) 45%, var(--text-3) 90%) 0 0 / 200% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 1.8s linear infinite;
}
@keyframes shimmer { to { background-position: -200% 0; } }
@property --angle { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
@keyframes turn { to { --angle: 360deg; } }
.steps { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s var(--ease); }
.activity.open .steps { grid-template-rows: 1fr; }
.steps-inner { overflow: hidden; min-width: 0; }
.steps-list { margin: 10px 0 2px 9px; padding-left: 19px; border-left: 1.5px solid var(--sep); display: flex; flex-direction: column; gap: 14px; }
.step, .sub { position: relative; min-width: 0; }
.step::before, .sub::before {
  content: ""; position: absolute; left: -24.5px; top: 7px; width: 9px; height: 9px; border-radius: 50%;
  background: var(--bg); border: 2px solid var(--text-3);
}
.step.ok::before, .sub.ok::before { border-color: var(--green-dot); background: var(--green-dot); }
.step.err::before, .sub.err::before { border-color: var(--orange-dot); background: var(--orange-dot); }
.step.run::before, .sub.run::before { border-color: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
.step.wait::before { border-color: var(--accent); background: var(--accent); }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px var(--accent-soft); } }
.step-title { font-size: 14px; font-weight: 600; color: var(--text); }
.step-quote {
  margin-top: 4px; font-size: 13px; color: var(--text-2); white-space: pre-wrap; overflow-wrap: anywhere;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden;
}
.step-note {
  font-size: 13px; color: var(--text-2); margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; line-clamp: 4; overflow: hidden;
}
.step-note.warn, .step.err > .step-note, .sub.err > .step-note { color: var(--orange); }
.subs { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; padding-left: 16px; border-left: 1.5px dashed var(--sep); }
.subs:empty { display: none; }
.sub::before { left: -21.5px; top: 6px; width: 7px; height: 7px; }
.sub-title { font-size: 13px; font-weight: 600; color: var(--text); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--fill); color: var(--text-2); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
pre.code {
  margin: 8px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--fill); overflow-x: auto;
  font: 12.5px/1.55 var(--mono); color: var(--text); white-space: pre-wrap; word-break: break-word;
}
.step pre.code { max-height: 220px; overflow-y: auto; }
details.fold > summary { cursor: pointer; font-size: 12.5px; color: var(--text-2); margin-top: 6px; list-style: none; display: inline-flex; align-items: center; gap: 4px; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::before { content: "›"; display: inline-block; transition: transform .2s; font-size: 15px; line-height: 1; }
details.fold[open] > summary::before { transform: rotate(90deg); }
.link-rows { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
.link-row { display: flex; align-items: center; gap: 8px; font-size: 13px; min-width: 0; }
.link-row a { color: var(--text); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.link-row a:hover { color: var(--accent); }
.link-row .host { flex: none; color: var(--text-3); font-size: 12px; }
.fav { flex: none; width: 16px; height: 16px; border-radius: 4px; background: var(--fill-2); object-fit: contain; }
.thumb { flex: none; width: 48px; height: 27px; border-radius: 5px; object-fit: cover; background: var(--fill-2); }

/* Answer (markdown) */
.answer { font-size: 16px; line-height: 1.65; overflow-wrap: anywhere; }
.answer:empty { display: none; }
.answer > :first-child { margin-top: 0; }
.answer > :last-child { margin-bottom: 0; }
.answer p { margin: 0 0 .85em; }
.answer h1, .answer h2, .answer h3, .answer h4 { font-family: var(--font-display); letter-spacing: -.01em; line-height: 1.3; margin: 1.3em 0 .5em; }
.answer h1 { font-size: 22px; } .answer h2 { font-size: 19px; } .answer h3, .answer h4 { font-size: 16.5px; }
.answer ul, .answer ol { margin: 0 0 .9em; padding-left: 1.35em; }
.answer li { margin: .25em 0; }
.answer li::marker { color: var(--text-3); }
.answer strong { font-weight: 650; }
.answer a { color: var(--accent); text-decoration: none; }
.answer a:hover { text-decoration: underline; }
.answer code { font: .88em var(--mono); background: var(--fill); padding: .12em .38em; border-radius: 6px; }
.answer pre { background: var(--fill); padding: 12px 14px; border-radius: 12px; overflow-x: auto; }
.answer pre code { background: none; padding: 0; }
.answer .code-block { background: var(--fill); border-radius: 12px; margin: 0 0 .9em; overflow: hidden; }
.answer .code-block pre { margin: 0; border-radius: 0; padding-top: 2px; }
.code-head { display: flex; align-items: center; justify-content: space-between; padding: 5px 6px 0 14px; font: 12px var(--mono); color: var(--text-3); }
.code-copy { display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; border-radius: 8px; font: 500 12px var(--font); color: var(--text-2); transition: background .2s, color .2s; }
.code-copy:hover { background: var(--fill-2); color: var(--text); }
.code-copy svg { width: 14px; height: 14px; }
.answer hr { border: 0; border-top: 1px solid var(--sep); margin: 1.4em 0; }
.answer .math { overflow-x: auto; overflow-y: hidden; margin: 0 0 .9em; }
.answer .katex { font-size: 1.05em; }
.answer blockquote { margin: 0 0 .9em; padding-left: 14px; border-left: 3px solid var(--sep-2); color: var(--text-2); }
.caret { display: inline-block; width: .55em; height: 1.05em; margin-left: 2px; vertical-align: -.16em; border-radius: 2px; background: var(--accent); animation: blink 1s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }

/* Tables (answers, cards and steps) */
.table-wrap { overflow-x: auto; margin: 0 0 1em; border: 1px solid var(--sep); border-radius: 14px; background: var(--elev); }
.card .table-wrap, .step .table-wrap { margin: 0; }
.step .table-wrap { margin-top: 8px; max-height: 240px; overflow-y: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
th, td { padding: 9px 14px; text-align: left; white-space: nowrap; }
th { font-size: 12px; font-weight: 600; color: var(--text-2); background: color-mix(in srgb, var(--fill) 60%, var(--elev)); position: sticky; top: 0; }
td { border-top: 1px solid var(--sep); }
tr:hover td { background: color-mix(in srgb, var(--fill) 45%, transparent); }
td.num, th.num { text-align: right; }
td.wrap { white-space: normal; min-width: 180px; }
.step table { font-size: 12.5px; }
.step th, .step td { padding: 6px 12px; }

/* Cards: charts, tables, images, diagrams, weather, notes, code, questions */
.artifacts { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.artifacts:empty { display: none; }
.card { background: var(--elev); border: 1px solid var(--sep); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); padding: 18px 20px 16px; min-width: 0; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.card-title { font: 600 15.5px/1.3 var(--font-display); letter-spacing: -.01em; overflow-wrap: anywhere; }
.card-sub { font-size: 12.5px; color: var(--text-3); margin-top: 2px; }
.card-notes { margin: 12px 0 0; padding-left: 1.2em; font-size: 13px; color: var(--text-2); }
.card-notes li { margin: 2px 0; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.legend i.dash { background: repeating-linear-gradient(90deg, var(--accent) 0 4px, transparent 4px 7px) !important; }
.legend i.band { height: 10px; border-radius: 3px; }
.plot { position: relative; height: 260px; }
.plot.pie-plot { height: 230px; }
.legend .swatch { width: 10px; height: 10px; border-radius: 3px; }
.boxes { display: flex; flex-direction: column; gap: 10px; }
.box-row { display: grid; grid-template-columns: minmax(90px, 30%) 1fr auto; align-items: center; gap: 12px; font-size: 13.5px; }
.box-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.box-row .val { color: var(--text-2); font-variant-numeric: tabular-nums; }
.box-track { position: relative; height: 18px; }
.box-track .whisker { position: absolute; top: 8.5px; height: 1px; background: var(--text-3); }
.box-track .iqr { position: absolute; top: 3px; height: 12px; border-radius: 4px; background: color-mix(in srgb, var(--accent) 22%, transparent); border: 1px solid var(--accent); box-sizing: border-box; }
.box-track .median { position: absolute; top: 1px; width: 2px; height: 16px; background: var(--accent); border-radius: 1px; }
.box-track .out { position: absolute; top: 7px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--text-3); opacity: .7; }
.box-scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-3); margin: 4px 0 0 calc(30% + 12px); }
.heat { overflow-x: auto; }
.heat table { border-collapse: separate; border-spacing: 2px; font-size: 11.5px; }
.heat th { color: var(--text-3); font-weight: 500; padding: 2px 6px; white-space: nowrap; }
.heat th.row { text-align: right; }
.heat td { min-width: 34px; height: 24px; border-radius: 4px; text-align: center; color: var(--text); font-variant-numeric: tabular-nums; }
.bars { display: flex; flex-direction: column; gap: 9px; }
.bar-row { display: grid; grid-template-columns: minmax(90px, 34%) 1fr auto; align-items: center; gap: 12px; font-size: 13.5px; }
.bar-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
.bar-row .track { height: 10px; border-radius: 5px; background: var(--fill); overflow: hidden; }
.bar-row .fill { height: 100%; width: 0; border-radius: 5px; background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 75%, #64d2ff), var(--accent)); transition: width .9s var(--ease); }
.bar-row .val { font-variant-numeric: tabular-nums; color: var(--text-2); min-width: 64px; text-align: right; }
.more { margin-top: 10px; font-size: 13px; color: var(--accent); font-weight: 500; }
.muted { color: var(--text-3); font-size: 13px; }
.card.media { padding: 10px; }
.card.media img { display: block; width: 100%; height: auto; border-radius: 14px; background: var(--fill); }
.media-foot { display: flex; align-items: center; gap: 10px; padding: 10px 6px 2px; font-size: 13px; color: var(--text-2); }
.media-foot span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.media-foot a { flex: none; font-weight: 500; text-decoration: none; }
.diagram { overflow-x: auto; display: flex; justify-content: center; }
.diagram svg { max-width: 100%; height: auto; }
.code-files { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.code-files img { max-width: 100%; border-radius: 12px; border: 1px solid var(--sep); background: #fff; }
.code-files a.chip { text-decoration: none; color: var(--text); }
pre.out { max-height: 260px; overflow: auto; }
pre.err-out { color: var(--orange); }
.weather-now { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.temp { font: 600 44px/1 var(--font-display); letter-spacing: -.03em; }
.cond { font-size: 15px; font-weight: 500; }
.days { display: grid; gap: 2px; margin-top: 14px; }
.day { display: grid; grid-template-columns: 54px 1fr auto auto; gap: 12px; align-items: center; font-size: 13.5px; padding: 6px 0; border-top: 1px solid var(--sep); font-variant-numeric: tabular-nums; }
.day .d { font-weight: 600; }
.day .c { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.day .r { color: var(--accent); font-size: 12.5px; min-width: 36px; text-align: right; }
.card.slim { padding: 12px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.file-below { width: 100%; }
.file-below .answer h1 { font-size: 16px; } .file-below .answer h2 { font-size: 14.5px; margin-top: .8em; }
.file-below .answer { font-size: 14px; }
.file-outputs img { display: block; max-width: 100%; border-radius: 12px; margin: 4px 0 8px; }
.card.slim .icon { flex: none; width: 18px; height: 18px; color: var(--text-2); }
.card.slim .what { flex: 1; min-width: 160px; font-size: 14px; }
.card.slim .what b { font-weight: 600; }
.card.slim .ask { width: 100%; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13.5px; color: var(--text-2); padding-left: 30px; }
.card.question { border-color: color-mix(in srgb, var(--accent) 35%, var(--sep)); box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow-sm); }
.card.question.closed { border-color: var(--sep); box-shadow: var(--shadow-sm); }
.q-text { font-size: 15.5px; font-weight: 600; line-height: 1.45; }
.q-from { font-size: 12px; color: var(--text-3); margin-bottom: 4px; }
.q-options { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.q-opt {
  padding: 8px 14px; border-radius: 12px; font-size: 14px; text-align: left; line-height: 1.35;
  background: var(--fill); border: 1px solid transparent; transition: background .2s, border-color .2s, transform .2s var(--spring);
}
.q-opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.q-opt:active:not(:disabled) { transform: scale(.98); }
.q-opt.chosen { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.q-opt:disabled:not(.chosen) { opacity: .55; }
.q-form { display: flex; gap: 8px; margin-top: 10px; }
.q-form input { flex: 1; min-width: 0; height: 38px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--sep-2); background: var(--bg); outline: 0; font-size: 14.5px; }
.q-form input:focus { border-color: var(--accent); }
.q-foot { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 13px; color: var(--text-3); }
.q-foot button { color: var(--text-2); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
.q-opt.allow { background: var(--accent); color: #fff; font-weight: 600; }
.q-opt.allow:hover:not(:disabled) { background: var(--accent-hover); border-color: transparent; }
.approval.danger .q-opt.allow { background: var(--red); }
.approval.danger .q-opt.allow:hover:not(:disabled) { background: color-mix(in srgb, var(--red) 88%, #000); }
.q-opt.allow.chosen { color: #fff; }
.q-facts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.q-facts span { font-size: 12.5px; color: var(--text-2); background: var(--fill); padding: 3px 9px; border-radius: 8px; overflow-wrap: anywhere; }
.q-said { margin-top: 10px; font-size: 14px; color: var(--text-2); }
.q-said b { color: var(--text); }

/* Sources under an answer */
.sources { display: flex; flex-direction: column; gap: 8px; }
.sources:empty { display: none; }
.sources-label { font-size: 12px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; }
.site-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.site-card {
  display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 14px; text-decoration: none; color: var(--text);
  background: var(--elev); border: 1px solid var(--sep); transition: border-color .2s, transform .2s var(--spring); min-width: 0;
}
.site-card:hover { border-color: var(--sep-2); transform: translateY(-1px); }
.site-card .fav { margin-top: 2px; }
.site-card .st { font-size: 13.5px; font-weight: 500; line-height: 1.35; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; }
.site-card .sh { font-size: 12px; color: var(--text-3); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.video { border-radius: var(--r); overflow: hidden; border: 1px solid var(--sep); background: var(--elev); }
.video-frame { position: relative; aspect-ratio: 16 / 9; background: #000; }
.video-frame img, .video-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: cover; }
.video-frame button { position: absolute; inset: 0; display: grid; place-items: center; }
.play { width: 64px; height: 44px; border-radius: 12px; background: rgba(0, 0, 0, .72); display: grid; place-items: center; transition: background .2s, transform .2s var(--spring); }
.video-frame button:hover .play { background: #ff0033; transform: scale(1.06); }
.play svg { width: 22px; height: 22px; fill: #fff; }
.video-info { padding: 10px 14px 12px; }
.video-info a { color: var(--text); font-weight: 600; font-size: 14px; text-decoration: none; }
.video-info a:hover { color: var(--accent); }
.video-info .sh { font-size: 12.5px; color: var(--text-3); margin-top: 2px; }
.sources-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.source {
  display: inline-flex; align-items: center; gap: 6px; max-width: 100%; height: 28px; padding: 0 11px 0 9px; border-radius: 999px;
  background: var(--fill); color: var(--text-2); font-size: 12.5px; transition: background .2s, color .2s;
}
.source:hover, .source[aria-expanded="true"] { background: var(--fill-2); color: var(--text); }
.source .icon { width: 14px; height: 14px; }
.source span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.passage { font-size: 14px; line-height: 1.55; color: var(--text-2); background: var(--elev); border: 1px solid var(--sep); border-radius: var(--r); padding: 12px 14px; animation: rise .3s var(--ease); white-space: pre-wrap; overflow-wrap: anywhere; }
.passage b { color: var(--text); font-weight: 600; display: block; margin-bottom: 4px; font-size: 13px; }

/* Answer footer */
.meta { display: flex; align-items: center; gap: 4px; min-height: 28px; color: var(--text-3); font-size: 12.5px; font-variant-numeric: tabular-nums; opacity: 0; transition: opacity .3s; }
.meta.show { opacity: 1; }
.meta .stat { display: inline-flex; align-items: center; gap: 4px; }
.meta .mini { width: 13px; height: 13px; }
.meta .sep { opacity: .5; margin: 0 4px; }
.meta .icon-btn { width: 28px; height: 28px; border-radius: 8px; margin-left: 2px; }
.meta .icon-btn .icon { width: 15px; height: 15px; }
.callout { padding: 12px 14px; border-radius: var(--r); background: color-mix(in srgb, var(--red-dot) 9%, var(--elev)); border: 1px solid color-mix(in srgb, var(--red-dot) 25%, transparent); font-size: 14px; }

/* Upload events */
.event { align-self: center; width: min(460px, 100%); }
.file-card { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: var(--r); background: var(--elev); border: 1px solid var(--sep); box-shadow: var(--shadow-sm); }
.file-icon { flex: none; width: 36px; height: 40px; border-radius: 8px; display: grid; place-items: center; color: #fff; font: 700 9.5px/1 var(--font); letter-spacing: .03em; }
.file-main { min-width: 0; flex: 1; }
.file-name { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-status { font-size: 12.5px; color: var(--text-2); margin-top: 2px; }
.file-card.err .file-status { color: var(--red); }
.progress { height: 4px; border-radius: 2px; background: var(--fill); overflow: hidden; margin-top: 7px; }
.progress div { height: 100%; width: 0; background: var(--accent); border-radius: 2px; transition: width .2s; }
.progress.indeterminate div { width: 35%; animation: slide 1.1s var(--ease) infinite; }
@keyframes slide { from { transform: translateX(-110%); } to { transform: translateX(310%); } }
.file-state { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; }
.file-card.ok .file-state { background: var(--green-dot); color: #fff; }
.file-card.err .file-state { background: var(--red-dot); color: #fff; }
.file-state .icon { width: 13px; height: 13px; stroke-width: 2.6; }
.event .chips { justify-content: center; margin-top: 10px; }
.event .chip { background: var(--elev); border: 1px solid var(--sep); color: var(--text); padding: 5px 12px; font-size: 13px; transition: border-color .2s, transform .2s var(--spring); }
.event .chip:hover { border-color: var(--sep-2); transform: translateY(-1px); }
.event .warn { font-size: 12.5px; color: var(--text-3); margin-top: 8px; text-align: center; }

/* ── Composer ───────────────────────────────────────────────────────────── */
.dock {
  position: fixed; inset: auto 0 0 var(--side-x); z-index: 15;
  padding: 28px 20px max(14px, env(safe-area-inset-bottom));
  background: linear-gradient(to bottom, transparent, var(--bg) 38%);
  pointer-events: none;
}
.dock > * { pointer-events: auto; }
.composer {
  position: relative; max-width: var(--col); margin: 0 auto; display: flex; align-items: flex-end; gap: 6px;
  padding: 8px; border-radius: 28px; background: var(--elev); border: 1px solid var(--sep); box-shadow: var(--shadow);
  transition: box-shadow .3s var(--ease), border-color .3s;
}
.composer:focus-within { border-color: var(--sep-2); box-shadow: var(--shadow-lg); }
.composer.answering { border-color: color-mix(in srgb, var(--accent) 45%, var(--sep)); }
.composer::before, .composer::after {
  content: ""; position: absolute; inset: -2px; border-radius: 30px; padding: 2px; pointer-events: none; opacity: 0;
  background: conic-gradient(from var(--angle, 0deg), #0a84ff, #bf5af2, #ff375f, #ff9f0a, #64d2ff, #0a84ff);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  transition: opacity .5s var(--ease);
}
.composer::after { filter: blur(14px); inset: -4px; }
.composer.working::before { opacity: .9; animation: turn 3.5s linear infinite; }
.composer.working::after { opacity: .45; animation: turn 3.5s linear infinite; }
.composer textarea {
  flex: 1; min-height: 40px; max-height: 200px; resize: none; border: 0; outline: 0; background: transparent; color: var(--text);
  font: 400 16px/1.5 var(--font); padding: 8px 6px;
}
.composer textarea::placeholder { color: var(--text-3); }
.round {
  flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  transition: background .2s, color .2s, transform .25s var(--spring), opacity .2s;
}
.round:active { transform: scale(.92); }
.attach { color: var(--text-2); background: var(--fill); }
.attach:hover { background: var(--fill-2); color: var(--text); }
.send { background: var(--accent); color: #fff; }
.send:hover { background: var(--accent-hover); }
.send:disabled { background: var(--fill-2); color: var(--text-3); }
.send .icon { stroke-width: 2.2; }
.send .stop { display: none; width: 12px; height: 12px; border-radius: 3px; background: currentColor; }
.busy .send { background: var(--text); color: var(--bg); }
.busy .send .icon { display: none; }
.busy .send .stop { display: block; }
.fineprint { max-width: var(--col); margin: 9px auto 0; text-align: center; font-size: 12px; color: var(--text-3); }
.jump {
  position: fixed; left: calc(var(--side-x) + (100vw - var(--side-x)) / 2); bottom: calc(var(--dock-h) + 8px); z-index: 16; transform: translate(-50%, 8px);
  width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
  background: var(--glass); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  border: 1px solid var(--sep); box-shadow: var(--shadow); color: var(--text-2);
  opacity: 0; pointer-events: none; transition: opacity .25s, transform .3s var(--spring);
}
.jump.show { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }

/* ── Drop overlay ───────────────────────────────────────────────────────── */
.drop {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 24px;
  background: color-mix(in srgb, var(--bg) 55%, transparent);
  -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%);
  opacity: 0; pointer-events: none; transition: opacity .25s var(--ease);
}
.drop.show { opacity: 1; }
.drop-box {
  width: min(520px, 100%); padding: 48px 32px; border-radius: 28px; text-align: center;

// Maths as the model writes it: $$…$$ and \[…\] as blocks, $…$ and \(…\) inline. A single $ follows
// pandoc's rule - no space after the opening $, none before the closing one, and no digit after it -
// so "$5 and $10" stays text while "$\rightarrow$" and "($Q_{next}$)" become maths.

    start: src => { const i = src.search(/\$\$|\\\[/); return i < 0 ? undefined : i; },
    tokenizer(src) {
      const m = /^(?:\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\])[^\S\n]*(?:\n|$)/.exec(src);
      if (m) return { type: "mathBlock", raw: m[0], text: (m[1] ?? m[2]).trim() };
    },
    renderer: t => `<div class="math">${tex(t.text, true)}</div>` },
  { name: "mathInline", level: "inline",
    start: src => { const i = src.search(/\$|\\\(/); return i < 0 ? undefined : i; },
    tokenizer(src) {
      let m = /^\$\$([\s\S]+?)\$\$/.exec(src);
      if (m) return { type: "mathInline", raw: m[0], text: m[1].trim(), display: true };
      m = /^\\\(([\s\S]+?)\\\)/.exec(src) || /^\$(?![\s$])((?:\\.|[^\\$\n])*?[^\s\\])\$(?!\d)/.exec(src);

async function detail(response) {
  try {
    const body = await response.json();
    if (typeof body.detail === "string") return body.detail;
    if (Array.isArray(body.detail)) return body.detail.map(d => d.msg).join("; ");
  } catch {}
  return `${response.status} ${response.statusText}`;
}
async function api(path, options = {}) {
  let r;
  try { r = await fetch(API + path, options); } catch { throw new Error("Can't reach the server. Is it running?"); }
  if (!r.ok) throw new Error(await detail(r));
  return r.status === 204 ? null : r.json();
}
const send = (method, path, body) => api(path, { method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body ?? {}) });

function uploadFile(path, file, onProgress) {  // XHR, for upload progress
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open("POST", API + path);
    xhr.responseType = "json";
    xhr.upload.onprogress = e => e.lengthComputable && onProgress(e.loaded / e.total);
    xhr.onload = () => {
      if (xhr.status < 300) return resolve(xhr.response);
      const d = xhr.response?.detail;
      reject(new Error(typeof d === "string" ? d : Array.isArray(d) ? d.map(x => x.msg).join("; ") : `Upload failed (${xhr.status})`));
    };
    xhr.onerror = () => reject(new Error("Can't reach the server."));
    const form = new FormData();
    form.append("file", file);
    xhr.send(form);
  });
}

async function* serverEvents(response) {
  const reader = response.body.getReader(), decoder = new TextDecoder();
  let buffer = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    let cut;
    while ((cut = buffer.indexOf("\n\n")) >= 0) {
      const raw = buffer.slice(0, cut);
      buffer = buffer.slice(cut + 2);
      let event = "message";
      const data = [];
      for (const line of raw.split("\n")) {
        if (line.startsWith("event:")) event = line.slice(6).trim();
        else if (line.startsWith("data:")) data.push(line.slice(5).trimStart());
      }
      if (data.length) yield [event, JSON.parse(data.join("\n"))];
    }
  }
}

async function selectWorkspace(id) {

async function loadChats() {

  renderChats();
  clearTimeout(state.chatPoll);  // a turn running in a chat this page is not following: notice when it ends

function renderChats() {
  const list = $("#chatList");
  if (!state.chats.length) { list.replaceChildren(h("li", { class: "chat-empty" }, "No chats yet")); return; }
  list.replaceChildren(...state.chats.map(c => {
    const del = h("button", { class: "del", "aria-label": `Delete chat ${c.title}`, title: "Delete chat", html: svg("trash") });
    del.addEventListener("click", e => { e.stopPropagation(); deleteChat(c); });
    const li = h("li", { class: `chat-item${state.chat?.id === c.id ? " active" : ""}`, tabindex: "0", title: c.title },
      c.running ? h("span", { class: "run", title: "Answering…" }) : c.pending ? h("span", { class: "q", title: "Waiting for your answer" }) : null,
      h("span", { class: "t" }, c.title), h("span", { class: "when" }, when(c.updated_at)), del);
    li.addEventListener("click", () => openChat(c.id));
    li.addEventListener("keydown", e => { if (e.key === "Enter") openChat(c.id); });
    return li;

}

function setTitle() {
  $("#chatTitle").textContent = state.chat?.title || "New chat";
  document.title = state.chat ? `${state.chat.title} · Assistant` : "Assistant";
}

function newChat() {
  detach();
  state.chat = null;
  state.pending = null;
  save(KEYS.chat, null);
  thread.replaceChildren();
  renderHero();
  renderChats();
  setTitle();
  updateComposer();
  closeSide();
  input.focus();
}

async function openChat(id, again = false) {
  if (!again && state.chat?.id === id && !$(".hero")) { closeSide(); return; }  // already open (maybe still answering)
  detach();
  const ticket = ++state.opening;  // a newer click wins
  let data;
  try { data = await api(`/chats/${id}/messages`); }
  catch (e) { toast(e.message, true); await loadChats(); return; }
  if (ticket !== state.opening) return;
  state.chat = data.chat;
  state.pending = null;
  save(KEYS.chat, id);
  thread.replaceChildren();
  const rows = data.messages, live = rows.filter(m => m.live);
  if (rows.length) {
    // A turn still running (the page reloaded, or the chat was left mid-answer): show what is
    // stored before it, then follow the turn from its start.
    const continues = data.running && !live.some(m => m.role === "user");  // answering a question
    let view = replay(rows.filter(m => !m.live), data.chat, continues);
    if (data.running) {
      if (continues && view) {
        const said = live.find(m => m.role === "tool");
        view.resume(said?.skipped ? null : said?.answer ?? null, said?.id);
      } else {
        const user = live.find(m => m.role === "user");
        if (user) addUser(user.text);
        view = assistantView();
      }
      run(`/chats/${id}/stream`, null, view);
    }
  } else renderHero();
  renderChats();
  setTitle();
  updateComposer();
  closeSide();
  requestAnimationFrame(() => stick(true));
}

async function deleteChat(c) {
  if (!await confirmDialog(`Delete “${c.title}”?`, "Its messages are removed and it is no longer found by recall. This can't be undone.", "Delete")) return;
  try { await api(`/chats/${c.id}`, { method: "DELETE" }); } catch (e) { toast(e.message, true); return; }
  if (state.chat?.id === c.id) newChat();
  await loadChats();
}

/* Questions: buttons for the options, a typed answer, or skip */
function questionCard(a) {

  const el = h("div", { class: `card question closed enter${ask ? " approval" : ""}${["delete_files", "replace_file"].includes(ask?.action) ? " danger" : ""}` });
  const via = a.tool && DELEGATES.has(a.tool) ? `${stepLabel(a.tool, false)} needs you to decide` : ask ? "Needs your permission" : null;
  if (via) el.append(h("div", { class: "q-from" }, via));

  if (ask) {
    const facts = ask.action === "delete_files" ? ask.named || ask.items || []

  }
  const opts = (a.options || []).map((o, i) => h("button", { class: `q-opt${ask && i === 0 ? " allow" : ""}`, disabled: true, onclick: () => answer(o) }, o));
  if (opts.length) el.append(h("div", { class: "q-options" }, opts));

  if (form) el.append(form);

    el,

/* ═══ Steps ═════════════════════════════════════════════════════════════ */
function inputDetail(name, input) {

    const quote = h("div", { class: "step-quote" }, input.task || input.question);
    return input.data ? h("div", {}, quote, h("div", { class: "chips" }, h("span", { class: "chip" }, `table: ${input.data}`))) : quote;
  }
  if (input.expression) return h("pre", { class: "code" }, input.expression);
  if (input.sql) return h("pre", { class: "code" }, input.sql);
  if (name === "run_code" && input.code) return h("details", { class: "fold" }, h("summary", {}, `Code · ${plural(input.code.split("\n").length, "line")}`), h("pre", { class: "code" }, input.code));
  if (name === "fix_code" && input.new_code != null) return h("details", { class: "fold" }, h("summary", {}, `Lines ${input.from_line}-${input.to_line}`), h("pre", { class: "code" }, input.new_code));
  if (name === "read_webpage" && input.url) {
    return h("div", { class: "chips" }, h("span", { class: "chip", title: input.url }, host(input.url)), input.find ? h("span", { class: "chip" }, `looking for: ${input.find}`) : null);
  }
  if (name === "generate_image" && input.prompt) return h("div", { class: "step-quote" }, input.prompt);
  const chips = Object.entries(input).filter(([k, v]) => v != null && v !== "" && v !== false && !["title", "content", "mermaid", "options", "allow_text"].includes(k))
    .map(([k, v]) => {
      const text = Array.isArray(v) ? plural(v.length, k.replace(/s$/, "")) : typeof v === "object" ? JSON.stringify(v) : String(v);
      return h("span", { class: "chip", title: text }, `${k.replace(/_/g, " ")}: ${text.length > 60 ? text.slice(0, 60) + "…" : text}`);
    });
  return chips.length ? h("div", { class: "chips" }, chips) : null;
}

function activityEl() {
  const label = h("span", { class: "label shimmer" }, "Thinking…");
  const head = h("button", { class: "activity-head", "aria-expanded": "false" },
    h("span", { class: "orb" }), h("span", { class: "done-mark", html: svg("check") }), h("span", { class: "wait-mark", html: svg("ask") }),
    label, h("span", { html: svg("chev", "icon chev") }));
  const list = h("div", { class: "steps-list" });
  const el = h("div", { class: "activity" }, head, h("div", { class: "steps" }, h("div", { class: "steps-inner" }, list)));
  let touched = false;  // once the user opens or closes it, it stays where they put it
  const setOpen = open => { el.classList.toggle("open", open); head.setAttribute("aria-expanded", open); };
  head.addEventListener("click", () => { touched = true; setOpen(!el.classList.contains("open")); });
  const steps = new Map();
  let helperActions = 0;

  const view = {
    el, steps,
    running(text) { el.hidden = false; el.classList.remove("done", "waiting"); label.className = "label shimmer"; label.textContent = text; },
    writing() { if (!steps.size) el.hidden = true; else { view.fold(); view.running("Writing…"); } },
    start(d) {
      if (d.name === "ask_user") return null;  // the question card is the step
      const step = { id: d.id, name: d.name, delegate: DELEGATES.has(d.name), done: false, sub: null, tables: [], code: null };
      step.input = d.input;
      step.title = h("div", { class: "step-title" }, `${stepLabel(d.name, false, d.input)}…`);
      step.subs = h("div", { class: "subs" });
      step.el = h("div", { class: "step run" }, step.title, inputDetail(d.name, d.input), step.subs);
      steps.set(d.id, step);
      list.append(step.el);
      view.running(`${stepLabel(d.name, false, d.input)}…`);
      if (step.delegate && !touched) setOpen(true);  // watch a helper work; it folds when the answer starts
      return step;
    },
    end(d) {
      const step = steps.get(d.id) || view.start({ id: d.id, name: d.name, input: {} });
      if (!step) return;
      const failed = !["ok", "partial"].includes(d.status);
      step.done = true;
      step.el.className = `step ${failed ? "err" : "ok"}`;
      step.title.textContent = failed ? `${stepLabel(d.name, false, step.input)} · didn't work` : stepLabel(d.name, true, step.input);
      if (failed) step.el.insertBefore(h("div", { class: "step-note" }, errorText(d.summary)), step.subs);
      else if (step.delegate) {
        try {
          const r = JSON.parse(d.summary);
          if (r.warnings?.length) step.el.insertBefore(h("div", { class: "step-note warn" }, `Flagged: ${r.warnings.join("; ")}`), step.subs);
        } catch {}  // a long result is cut for the UI; nothing more to show
      }
      if (step.sub && !step.sub.done) view.subEnd(step, { status: "ok" });
    },
    wait(id) {
      const step = steps.get(id);
      if (step) { step.el.className = "step wait"; step.title.textContent = `${stepLabel(step.name, false)} · waiting for your answer`; }
      el.hidden = false;
      el.classList.remove("done");
      el.classList.add("waiting");
      label.className = "label";
      label.textContent = "Waiting for your answer";
    },
    answered(id) {
      const step = steps.get(id);
      if (step) { step.done = true; step.el.className = "step ok"; step.title.textContent = `${stepLabel(step.name, false)} · you answered`; }
    },
    resumed(id) {  // a helper got its answer and goes on
      const step = steps.get(id);
      if (step) { step.el.className = "step run"; step.title.textContent = `${stepLabel(step.name, false)}…`; }
      el.classList.remove("waiting");
      label.className = "label";
      label.textContent = step ? `${stepLabel(step.name, false)}…` : "Thinking…";
    },
    worker(step, e) {
      if (e.event === "tool") {
        const title = h("div", { class: "sub-title" }, `${stepLabel(e.name, false)}…`);
        step.sub = { name: e.name, done: false, evidence: false, title, el: h("div", { class: "sub run" }, title, inputDetail(e.name, e.input)) };
        step.subs.append(step.sub.el);
        helperActions++;
        view.running(`${stepLabel(e.name, false)}…`);
      } else if (e.event === "result" && step.sub) {
        view.subEnd(step, e);
      } else if (e.event === "check") {
        const ok = !e.problems?.length;
        step.subs.append(h("div", { class: `sub ${ok ? "ok" : "err"}` },
          h("div", { class: "sub-title" }, ok ? "Checked the answer" : e.retry ? "Checked the answer · fixing it" : "Checked the answer · flagged"),
          ok ? null : h("div", { class: "step-note" }, e.problems.join("; "))));
        view.running(ok ? "Writing the answer…" : "Fixing the answer…");
      }
    },
    subEnd(step, e) {
      const sub = step.sub, failed = !["ok", "partial"].includes(e.status);
      sub.done = true;
      sub.el.className = `sub ${failed ? "err" : "ok"}`;
      sub.title.textContent = failed ? `${stepLabel(sub.name, false)} · didn't run` : stepLabel(sub.name, true);
      if (failed && e.summary) sub.el.append(h("div", { class: "step-note" }, errorText(e.summary)));
      view.running(`${stepLabel(step.name, false)}…`);
    },
    evidence(step, a) {
      const into = step.sub && !step.sub.evidence ? step.sub : null;
      const node = evidenceEl(a, !into);
      if (!node) return;
      if (into) { into.evidence = true; into.el.append(node); }
      else { step.subs.append(h("div", { class: "sub ok" }, node)); helperActions += 1; }
    },
    fold() { if (!touched) setOpen(false); },
    finish() {
      const all = [...steps.values()];
      if (!all.length) { el.remove(); return; }
      el.hidden = false;
      el.classList.remove("waiting");
      el.classList.add("done");
      label.className = "label";
      const failed = all.filter(s => s.el.classList.contains("err")).length;
      label.textContent = [plural(all.length, "step"), helperActions ? plural(helperActions, "helper action") : null, failed ? `${failed} didn't work` : null].filter(Boolean).join(" · ");
      view.fold();
    },
    stop() { steps.size ? view.finish() : el.remove(); },
  };
  return view;
}

/* ═══ One reply ═════════════════════════════════════════════════════════ */
function addUser(text) {
  thread.append(h("div", { class: "msg user enter" }, h("div", { class: "bubble" }, text)));
}

function metaEl({ seconds, first, stats, answer, stopped }) {
  const parts = [];
  if (stopped) parts.push(["Stopped"]);
  if (seconds) parts.push([`${seconds.toFixed(1)} s`, "clock"]);
  if (first != null) parts.push([`first word ${first.toFixed(1)} s`]);
  const tokens = stats.reduce((n, s) => n + (s.output_tokens || 0), 0);
  const genSeconds = stats.reduce((t, s) => t + (s.tokens_per_second ? (s.output_tokens || 0) / s.tokens_per_second : 0), 0);
  if (tokens && genSeconds) parts.push([`${(tokens / genSeconds).toFixed(0)} tok/s`, "bolt"]);
  const el = h("div", { class: "meta" });
  parts.forEach(([text, icon], i) => {
    if (i) el.append(h("span", { class: "sep" }, "·"));
    el.append(h("span", { class: "stat", title: icon === "bolt" ? `${count(tokens)} tokens written` : null, html: (icon ? svg(icon, "icon mini") : "") + escapeHtml(text) }));
  });
  if (answer) {
    const copy = h("button", { class: "icon-btn", "aria-label": "Copy answer", title: "Copy", html: svg("copy") });
    copy.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(answer); copy.innerHTML = svg("check"); setTimeout(() => (copy.innerHTML = svg("copy")), 1400); }
      catch { toast("Couldn't copy", true); }
    });
    el.append(copy);
  }
  requestAnimationFrame(() => el.classList.add("show"));
  return el;
}

// One assistant reply, built from the stream (or from the saved chat, through the same calls).
function assistantView() {
  const root = h("div", { class: "msg ai enter" });
  const activity = activityEl();
  const cards = h("div", { class: "artifacts" });
  const answer = h("div", { class: "answer" });
  const foot = h("div", { class: "artifacts" });
  root.append(activity.el, cards, answer, foot);
  thread.append(root);
  let text = "", roundStart = 0, frame = 0, streaming = true, current = null, question = null;
  const stats = [], web = new Map(), passages = [];
  const paint = () => {
    frame = 0;
    answer.innerHTML = markdown(text);
    polish(answer);
    if (streaming && text) addCaret(answer);
    stick();
  };
  const repaint = () => { if (!frame) frame = requestAnimationFrame(paint); };
  const show = el => { if (el) { cards.append(el); stick(); } };
  const promote = step => {  // what a helper found, as cards once it is done
    if (!step) return;
    if (step.tables.length) show(resultsCard(step.tables.slice(-4)));
    if (step.code) show(codeCard(step.code));
    step.tables = [];
    step.code = null;
  };

  const view = {
    get question() { return question; },
    text(chunk) {
      if (!text.slice(roundStart)) activity.writing();
      text += chunk;
      repaint();
    },
    toolStart(d) {
      if (text.slice(roundStart).trim()) text = text.trimEnd() + "\n\n";
      roundStart = text.length;
      const step = activity.start(d);
      if (step?.delegate) current = step;
      repaint();
    },
    toolEnd(d) {
      const step = activity.steps.get(d.id);
      if ("answer" in d || d.skipped) {  // a saved chat: this result is the user's answer to a question
        question?.close(d.skipped ? null : d.answer);
        if (step) activity.answered(d.id);
        if (step?.delegate) { promote(step); if (current === step) current = null; }
        return;
      }
      activity.end(d);
      if (step?.delegate) { promote(step); if (current === step) current = null; }
    },
    artifact(a) {
      if (a.type === "question") {
        question = questionCard(a);
        show(question.el);
      } else if (a.type === "answer") {  // the user's answer to a helper's question asked in place
        question?.close(a.skipped ? null : a.answer);
      } else if (a.type === "sources") {
        for (const item of a.items || []) item.url ? web.set(item.url, item) : passages.push(item);
        if (current && !(a.tool || "").endsWith("_worker")) activity.evidence(current, a);
      } else if (CARD_TYPES.has(a.type) || !current) {
        show(artifactCard(a));
      } else {  // a helper's working: shown in its step; its result tables and last code also as cards
        activity.evidence(current, a);
        if (a.type === "code") current.code = a;
        else if (a.type === "table" && !/^Columns of /.test(a.title || "")) current.tables.push(a);
      }
    },
    worker(e) { if (current) activity.worker(current, e); if (e.event === "turn" && e.usage) stats.push(e.usage); },
    stats(s) { stats.push(s); },
    ask(pending) {  // the turn pauses here until the user answers
      streaming = false;
      paint();
      if (!question) { question = questionCard(pending); show(question.el); }
      question.open();
      activity.wait(pending.call_id);
      stick();
    },
    resume(said, callId = state.pending?.call_id, inplace = state.pending?.inplace) {
      question?.close(said);
      if (inplace) {  // a helper asked in place: its step goes on working
        activity.resumed(callId);
        streaming = true;
        return;
      }
      activity.answered(callId);
      const step = activity.steps.get(callId);
      if (step === current) current = null;
      streaming = true;
      activity.running("Thinking…");
    },
    finish(final, timing) {
      streaming = false;
      if (final != null && final !== "") text = final;
      cancelAnimationFrame(frame);
      paint();
      drawAnswerDiagrams(answer);  // only once finished: a half-written diagram would fail to draw
      if (current) { promote(current); current = null; }
      activity.finish();
      if (web.size) foot.append(webSourcesEl([...web.values()]));
      if (passages.length) foot.append(passagesEl(passages));
      if (timing) foot.append(metaEl({ ...timing, stats, answer: text.trim() }));
      else if (text.trim()) foot.append(metaEl({ stats: [], answer: text.trim() }));
      stick();
    },
    error(message) {
      streaming = false;
      paint();
      activity.stop();
      foot.append(h("div", { class: "callout" }, message));
      stick();
    },
    stop(timing) {
      streaming = false;
      paint();
      activity.stop();
      foot.append(metaEl({ ...timing, stats, stopped: true, answer: text.trim() }));
    },
  };
  return view;
}

// A saved chat, through the same view calls the live stream uses.
function replay(messages, chat, keepOpen = false) {  // returns the last reply's view
  let view = null, last = "";
  const close = () => { if (view) view.finish(last); };
  for (const m of messages) {
    if (m.role === "user") {
      close();
      addUser(m.text);
      view = assistantView();
      last = "";
      continue;
    }
    if (!view) continue;
    if (m.role === "assistant") {
      if (m.text) { view.text(m.text); last = m.text; }
      for (const t of m.tools || []) view.toolStart(t);
    } else if (m.role === "tool") {
      view.toolEnd({ id: m.id, name: m.name, status: m.is_error ? "failed" : "ok", summary: m.summary, ...("answer" in m ? { answer: m.answer } : {}), ...(m.skipped ? { skipped: true } : {}) });
    } else if (m.role === "artifact") {
      view.artifact(m.artifact);
    }
  }
  if (keepOpen) return view;  // the running turn goes on in it
  if (view && chat.pending) {
    view.ask(chat.pending);
    state.pending = { ...chat.pending, view };
  } else close();
  return view;
}

/* ═══ Talking ═══════════════════════════════════════════════════════════ */
async function submit(text) {
  text = text.trim();
  if (!text || state.busy) return;
  if (state.pending) return answer(text);
  if (state.status && !state.status.ready) { toast(state.status.message || "The model isn't ready yet.", true); return; }
  if (!state.chat) {
    try { state.chat = await send("POST", `/workspaces/${state.ws.id}/chats`); }
    catch (e) { toast(e.message, true); return; }
    save(KEYS.chat, state.chat.id);
    state.chats.unshift(state.chat);
    renderChats();
  }
  hideHero();
  input.value = "";
  autosize();
  addUser(text);
  stick(true);
  await run(`/chats/${state.chat.id}/messages`, { text }, assistantView());
}

async function answer(said) {
  const pending = state.pending;
  if (!pending || state.busy) return;
  pending.view.resume(said);
  state.pending = null;
  input.value = "";
  autosize();
  await run(`/chats/${state.chat.id}/answer`, { answer: said }, pending.view);
}

// Sends a message or an answer (body), or follows the chat's running turn (body null), into view.
async function run(path, body, view) {
  const chatId = state.chat.id;
  setBusy(true);
  const controller = new AbortController();
  state.controller = controller;
  const started = performance.now();
  let first = null, ended = false, seen = false;
  const timing = () => ({ seconds: (performance.now() - started) / 1000, first: first && (first - started) / 1000 });
  try {
    const r = await fetch(API + path, body === null ? { signal: controller.signal }
      : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body), signal: controller.signal });
    if (!r.ok) throw new Error(await detail(r));
    for await (const [event, data] of serverEvents(r)) {
      seen = true;
      if (event === "text") { first ??= performance.now(); view.text(data.text); }
      else if (event === "tool_start") view.toolStart(data);
      else if (event === "tool_end") view.toolEnd(data);
      else if (event === "artifact") view.artifact(data.artifact);
      else if (event === "worker") view.worker(data);
      else if (event === "stats") view.stats(data);
      else if (event === "question") { ended = true; view.ask(data); state.pending = { ...data, view }; }
      else if (event === "done") { ended = true; view.finish(data.answer, timing()); }
      else if (event === "stopped") { ended = true; view.stop(timing()); }
      else if (event === "error") { ended = true; view.error(data.message); }
    }
    if (!ended && body === null && !seen) {  // the turn ended meanwhile: show the chat as stored
      controller.detached = true;
      state.controller = null;
      setBusy(false);
      return openChat(chatId, true);
    }
    if (!ended) view.error("The connection closed before the answer finished. Please try again.");
  } catch (e) {
    if (controller.detached) return;  // the page moved on; the turn goes on without it
    if (e.name === "AbortError") view.stop(timing());
    else view.error(e.message === "Failed to fetch" ? "Lost the connection to the server." : e.message);
  } finally {
    if (!controller.detached) {  // a detached run must not touch what the page shows now
      if (state.controller === controller) state.controller = null;
      setBusy(false);
      await loadChats();
      if (state.chat?.id === chatId && !state.controller) {  // checked after the wait: the page may have moved on
        state.chat = state.chats.find(c => c.id === chatId) || state.chat;
        setTitle();
        updateComposer();
      }
      loadItems();
    }
  }
}

function stopTurn() {  // the Stop button: the server stops the turn (its next token), then the stream is let go
  if (!state.controller) return;
  if (state.chat) fetch(`${API}/chats/${state.chat.id}/stop`, { method: "POST" }).catch(() => {});
  state.controller.abort();
}
function detach() {  // leaving the chat: its turn goes on, and opening the chat again follows it
  if (!state.controller) return;
  state.controller.detached = true;  // its run() leaves the page's state alone from here on
  state.controller.abort();
  state.controller = null;
  setBusy(false);
}

function setBusy(busy) {
  state.busy = busy;
  document.body.classList.toggle("busy", busy);
  composer.classList.toggle("working", busy);
  $("#sendBtn").setAttribute("aria-label", busy ? "Stop" : "Send");
  updateComposer();
}
const phone = matchMedia("(max-width: 640px)");
function updateComposer() {
  $("#sendBtn").disabled = !state.busy && !input.value.trim();
  composer.classList.toggle("answering", !!state.pending);
  input.placeholder = state.pending ? "Type your answer, or pick an option above…" : phone.matches ? "Ask anything…" : "Ask anything, or drop a file…";
}
function autosize() {
  input.style.height = "auto";
  input.style.height = `${Math.min(input.scrollHeight, 200)}px`;
}

composer.addEventListener("submit", e => {
  e.preventDefault();
  if (state.busy) stopTurn();
  else submit(input.value);
});
input.addEventListener("input", () => { autosize(); updateComposer(); });
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); composer.requestSubmit(); }
});
phone.addEventListener("change", updateComposer);

/* ═══ Files ═════════════════════════════════════════════════════════════ */
const FILE_COLORS = { csv: "#34c759", tsv: "#34c759", xlsx: "#248a3d", xlsm: "#248a3d", xls: "#248a3d", pdf: "#ff3b30", docx: "#0a84ff", txt: "#8e8e93", md: "#5e5ce6", markdown: "#5e5ce6", png: "#ff9f0a", jpg: "#ff9f0a", jpeg: "#ff9f0a", py: "#3776ab", json: "#8e8e93" };
const fileIcon = (name, label) => {
  const type = ext(name);
  return h("span", { class: "file-icon", style: `background:${FILE_COLORS[type] || "#8e8e93"}` }, label || type.slice(0, 4).toUpperCase() || "FILE");
};

function uploadCard(name, size) {
  const status = h("div", { class: "file-status" }, `${fileSize(size)} · uploading…`);
  const bar = h("div");
  const progress = h("div", { class: "progress" }, bar);
  const mark = h("span", { class: "file-state" });
  const box = h("div", { class: "file-card" }, fileIcon(name), h("div", { class: "file-main" }, h("div", { class: "file-name" }, name), status, progress), mark);
  const el = h("div", { class: "event enter" }, box);
  hideHero();
  thread.append(el);
  stick(true);
  return {
    progress(p) { bar.style.width = `${Math.round(p * 100)}%`; if (p >= 1) this.working("Reading the file…"); },
    working(text) { status.textContent = text; progress.classList.add("indeterminate"); },
    ok(text, follow = [], warning) {
      progress.remove(); box.classList.add("ok"); mark.innerHTML = svg("check"); status.textContent = text;
      if (follow.length) el.append(h("div", { class: "chips" }, follow.map(q => h("button", { class: "chip", onclick: () => submit(q) }, q))));
      if (warning) el.append(h("div", { class: "warn" }, warning));
      stick();
    },
    fail(text) { progress.remove(); box.classList.add("err"); mark.innerHTML = svg("cross"); status.textContent = text; stick(); },
  };
}

async function addFiles(files) {
  closeSheet();
  for (const file of files) {
    const view = uploadCard(file.name, file.size);
    try {
      const r = await uploadFile(`/workspaces/${state.ws.id}/files`, file, p => view.progress(p));
      if (r.kind === "table") view.ok(`${count(r.rows)} rows · saved as ${r.id}`, [`Give me an overview of ${r.name}`]);
      else if (r.kind === "document") view.ok(`${r.pages ? `${plural(r.pages, "page")} · ` : ""}${plural(r.passages, "passage")} searchable`, [`Summarise ${r.name}`], r.note);
      else view.ok(`Saved as ${r.id}`, []);
    } catch (e) { view.fail(e.message); }
  }
  loadItems();
}

$("#attachBtn").addEventListener("click", () => $("#fileInput").click());
$("#fileInput").addEventListener("change", e => { addFiles([...e.target.files]); e.target.value = ""; });
let dragDepth = 0;
const hasFiles = e => [...(e.dataTransfer?.types || [])].includes("Files");
window.addEventListener("dragenter", e => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth++; $("#drop").classList.add("show"); });
window.addEventListener("dragover", e => { if (hasFiles(e)) e.preventDefault(); });
window.addEventListener("dragleave", e => { if (!hasFiles(e)) return; if (--dragDepth <= 0) { dragDepth = 0; $("#drop").classList.remove("show"); } });
window.addEventListener("drop", e => {
  if (!hasFiles(e)) return;
  e.preventDefault(); dragDepth = 0; $("#drop").classList.remove("show");
  addFiles([...e.dataTransfer.files]);
});
input.addEventListener("paste", e => {
  const files = [...(e.clipboardData?.files || [])];
  if (files.length) { e.preventDefault(); addFiles(files); }
});

/* ═══ Library sheet ═════════════════════════════════════════════════════ */
function openSheet() {
  closeSide();
  $("#sheet").classList.add("show"); $("#scrim").classList.add("show"); $("#sheet").setAttribute("aria-hidden", "false");
  fillSheet();
  $("#sheetClose").focus();
}
function closeSheet() { $("#sheet").classList.remove("show"); $("#scrim").classList.remove("show"); $("#sheet").setAttribute("aria-hidden", "true"); }
function fillSheet() {
  $("#sheetSub").textContent = state.ws ? `In ${state.ws.name}` : "";
  const body = $("#sheetBody");
  if (!state.items.length) {
    body.replaceChildren(h("div", { class: "sheet-empty" }, "Nothing here yet. Add spreadsheets, documents or any file — or ask for charts, images and notes."));
    return;
  }
  const row = (icon, name, meta, ...actions) => h("li", {}, icon, h("div", { class: "li-main" }, h("div", { class: "li-name", title: name }, name), h("div", { class: "li-meta" }, meta)), ...actions);
  const glyph = (name, color) => h("span", { class: "file-icon", style: `background:${color}`, html: svg(name) });
  const from = i => i.parent ? ` · from ${i.parent}` : "";
  const sections = [
    ["Tables", itemsOf("table"), i => row(fileIcon(i.name || "", "DATA"), i.name, `${i.id} · ${count(i.rows)} rows × ${i.columns} columns${from(i)}`,
      h("button", { class: "li-act", onclick: () => previewTable(i) }, "View"))],
    ["Documents & files", itemsOf("file"), i => row(fileIcon(i.name || ""), i.name, `${i.id} · ${i.passages != null ? `${i.pages ? plural(i.pages, "page") : plural(i.words || 0, "word")} · searchable` : fileSize(i.bytes)}${i.report ? ` · ${i.report}` : ""}`,
      h("a", { class: "li-act", href: itemUrl(i.id) }, "Download"))],
    // Only the 5 latest notes come here: the ones the AI keeps in view (pinned automatically).
    ["Pinned notes", itemsOf("note"), i => row(glyph("note", "#5e5ce6"), i.title || i.name, `saved ${i.saved || ""} · kept in view`,
      h("button", { class: "li-act", onclick: () => viewNote(i) }, "View"))],
    ["Images", itemsOf("image"), i => row(h("img", { src: itemUrl(i.id), alt: "", style: "width:34px;height:34px;border-radius:7px;object-fit:cover;flex:none", loading: "lazy" }),
      i.name, `${i.id}${i.width ? ` · ${i.width}×${i.height}` : ""}`, h("a", { class: "li-act", href: itemUrl(i.id), target: "_blank", rel: "noopener" }, "Open"))],
    ["Models", itemsOf("model"), i => row(glyph("model", "#ff9f0a"), i.name, `${i.id}${i.target ? ` · predicts ${i.target}` : ""}${i.metric ? ` · ${i.metric} ${i.score}` : ""}`)],
  ];
  body.replaceChildren(...sections.filter(([, list]) => list.length).flatMap(([title, list, make]) => [
    h("div", { class: "sec-head" }, h("h3", {}, title), h("span", {}, String(list.length))),
    h("ul", { class: "list" }, list.map(make)),
  ]));
}
async function viewNote(item) {
  let text;
  try { text = await fetch(itemUrl(item.id)).then(r => { if (!r.ok) throw new Error("Couldn't open the note"); return r.text(); }); }
  catch (e) { toast(e.message, true); return; }
  await showDialog({ title: item.title || item.name, text: `Saved ${item.saved || ""} · kept in view`,
                     extra: h("div", { class: "answer", html: markdown(text) }), ok: "Close", cancel: false });
}
async function previewTable(item) {
  let data;
  try { data = await api(`/workspaces/${state.ws.id}/items/${item.id}/rows?limit=100`); } catch (e) { toast(e.message, true); return; }
  const shown = data.rows.length < data.total_rows ? `First ${data.rows.length} of ${count(data.total_rows)} rows` : plural(data.total_rows, "row");
  await showDialog({ title: `${item.name} (${item.id})`, text: shown, extra: tableEl(data.columns, data.rows), ok: "Close", cancel: false, wide: true });
}
$("#libraryBtn").addEventListener("click", openSheet);
$("#libraryBtnSide").addEventListener("click", openSheet);
$("#sheetClose").addEventListener("click", closeSheet);
$("#scrim").addEventListener("click", closeSheet);
$("#sheetAdd").addEventListener("click", () => $("#fileInput").click());

/* ═══ Dialogs & toasts ══════════════════════════════════════════════════ */
function showDialog({ title, text = "", value = null, extra = null, ok = "OK", cancel = "Cancel", danger = false, wide = false }) {
  const dialog = $("#dialog"), field = $("#dialogInput"), okBtn = $("#dialogOk"), cancelBtn = $("#dialogCancel");
  $("#dialogBox").classList.toggle("wide", wide);
  $("#dialogTitle").textContent = title;
  $("#dialogText").textContent = text;
  $("#dialogExtra").replaceChildren(...(extra ? [extra] : []));
  field.hidden = value == null;
  field.value = value ?? "";
  okBtn.textContent = ok;
  okBtn.className = `btn ${danger ? "danger" : "primary"}`;
  cancelBtn.hidden = !cancel;
  cancelBtn.textContent = cancel || "";
  dialog.classList.add("show");
  (value != null ? field : cancel ? cancelBtn : okBtn).focus();
  if (value != null) field.select();
  return new Promise(resolve => {
    const done = result => {
      dialog.classList.remove("show");
      okBtn.onclick = cancelBtn.onclick = dialog.onclick = field.onkeydown = null;
      resolve(result);
    };
    okBtn.onclick = () => done(value != null ? field.value.trim() : true);
    cancelBtn.onclick = () => done(value != null ? null : false);
    dialog.onclick = e => { if (e.target === dialog) cancelBtn.onclick(); };
    field.onkeydown = e => { if (e.key === "Enter") okBtn.onclick(); };
  });
}
const confirmDialog = (title, text, ok) => showDialog({ title, text, ok, danger: true });
const promptDialog = (title, text, value) => showDialog({ title, text, value, ok: "Save" });
function toast(message, error = false) {
  const el = h("div", { class: `toast${error ? " err" : ""}` }, message);
  $("#toasts").append(el);
  setTimeout(() => { el.style.transition = "opacity .3s"; el.style.opacity = "0"; setTimeout(() => el.remove(), 300); }, 3200);
}

/* ═══ Shell ═════════════════════════════════════════════════════════════ */
function closeSide() { document.body.classList.remove("side-open"); }
$("#menuBtn").addEventListener("click", () => document.body.classList.toggle("side-open"));
$("#sideScrim").addEventListener("click", closeSide);
$("#newChatBtn").addEventListener("click", newChat);
$("#newChatSide").addEventListener("click", newChat);
$("#wsBtn").addEventListener("click", e => { e.stopPropagation(); toggleMenu(); });
document.addEventListener("click", e => { if (!$("#wsMenu").hidden && !e.target.closest(".ws")) toggleMenu(false); });
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if ($("#dialog").classList.contains("show")) $("#dialogCancel").hidden ? $("#dialogOk").click() : $("#dialogCancel").click();
  else if (!$("#wsMenu").hidden) toggleMenu(false);
  else if ($("#sheet").classList.contains("show")) closeSheet();
  else if (document.body.classList.contains("side-open")) closeSide();
  else if (state.busy) stopTurn();
});

// Keep the conversation clear of the composer, whatever its height.
new ResizeObserver(() => {
  const dock = $("#dock").getBoundingClientRect().height;
  document.documentElement.style.setProperty("--dock-h", `${Math.ceil(dock) - 12}px`);
}).observe($("#dock"));
setInterval(() => { if (!state.busy) renderChats(); }, 60_000);  // "5m" ages

(async () => {
  updateComposer();
  refreshStatus();
  try { await loadWorkspaces(); }
  catch (e) { renderHero(); toast(e.message, true); }
  input.focus();
})();
</script>
