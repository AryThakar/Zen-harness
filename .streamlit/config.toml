[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
# Serves frontend/static (the self-hosted fonts) at app/static/.
enableStaticServing = true

# --- Design system ------------------------------------------------------------
# Plus Jakarta Sans for everything, JetBrains Mono for SQL and code; both are
# served with the app (no calls to font CDNs). Cool slate neutrals and one
# indigo accent, stepped separately for light and dark. The glass surfaces,
# borders and shadows on top of these are in frontend/theme.py.

[theme]
font = "Plus Jakarta Sans, system-ui, -apple-system, Segoe UI, sans-serif"
headingFont = "Plus Jakarta Sans, system-ui, -apple-system, Segoe UI, sans-serif"
codeFont = "JetBrains Mono, ui-monospace, monospace"
baseFontSize = 15
baseRadius = "12px"
buttonRadius = "12px"
showWidgetBorder = true
showSidebarBorder = false
metricValueFontSize = "1.9rem"
metricValueFontWeight = 700

[[theme.fontFaces]]
family = "Plus Jakarta Sans"
url = "app/static/fonts/plus-jakarta-sans-latin-wght-normal.woff2"
weight = "200 800"
style = "normal"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

[[theme.fontFaces]]
family = "Plus Jakarta Sans"
url = "app/static/fonts/plus-jakarta-sans-latin-ext-wght-normal.woff2"
weight = "200 800"
style = "normal"
# Includes the rupee sign (U+20B9).
unicodeRange = "U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF"

[[theme.fontFaces]]
family = "JetBrains Mono"
url = "app/static/fonts/jetbrains-mono-latin-wght-normal.woff2"
weight = "100 800"
style = "normal"

[theme.light]
primaryColor = "#3E63DD"
backgroundColor = "#F4F6FB"
secondaryBackgroundColor = "#EBEFF7"
textColor = "#141A2A"
linkColor = "#3A5BC7"
borderColor = "#D8DEEA"
dataframeBorderColor = "#E2E7F0"
dataframeHeaderBackgroundColor = "#EFF2F8"
codeBackgroundColor = "#EEF1F8"
blueColor = "#3E63DD"
greenColor = "#1F9D55"
redColor = "#D93D42"
yellowColor = "#D99A06"
orangeColor = "#E8663A"
violetColor = "#7A5AF8"

[theme.light.sidebar]
backgroundColor = "#EEF1F8"
secondaryBackgroundColor = "#E4E9F3"

[theme.dark]
primaryColor = "#5472E4"
backgroundColor = "#0A0F1E"
secondaryBackgroundColor = "#141B2D"
textColor = "#E8ECF6"
linkColor = "#9EB1FF"
borderColor = "#252E45"
dataframeBorderColor = "#232B40"
dataframeHeaderBackgroundColor = "#131A2B"
codeBackgroundColor = "#111829"
blueColor = "#5472E4"
greenColor = "#2FB36B"
redColor = "#E5535A"
yellowColor = "#E0A526"
orangeColor = "#E0703F"
violetColor = "#9B87FF"

[theme.dark.sidebar]
backgroundColor = "#0D1324"
secondaryBackgroundColor = "#161E32"
